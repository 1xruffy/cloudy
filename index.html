  const go=async()=>{if(busy)return;const v=norm(rk.value),k=find();
    if(!v||!k){$("#re").textContent=v?"That key isn't valid. Check it and try again.":"Enter your key first.";shake(kf);vl.classList.add("bad");say("Wrong key");setTimeout(()=>vl.classList.remove("bad"),600);return}
    busy=true;const db=getDB(),first=!db[v];if(first){db[v]=Date.now();ls.set(DBK,JSON.stringify(db))}
    $("#rf").classList.add("off");vl.classList.add("go");
    for(const t of ["Checking key","Validating license","Turning the lock"]){say(t);await wait(650);if(!ov.classList.contains("on"))return}
    vl.classList.add("open");say("Unlocked");burst();setTimeout(burst,300);document.body.classList.add("pm");await wait(1000);if(!ov.classList.contains("on"))return;
    $("#pt").textContent=first?"Key redeemed":"Already redeemed";$("#rf").remove();vl.classList.add("sm");vt.remove();
    const mask=k.key.slice(0,3)+"•".repeat(Math.max(3,k.key.length-6))+k.key.slice(-3);
    $("#rs").innerHTML=`<div class="tk"><div style="display:flex;justify-content:space-between;align-items:center"><div><small class="mut">Cloudy Premium</small><h3 style="font-size:1.9rem;color:var(--gold)">${esc(k.type)}</h3></div><span class="badge">Active</span></div><div class="perf"></div>
      <div class="kv"><span class="mut">Key</span><b id="a1" style="cursor:pointer;font-family:ui-monospace,monospace"></b></div><div class="kv"><span class="mut">Expires</span><b>Never</b></div>
      <div class="term" style="margin-top:12px"><div class="tb"><code id="kl"></code><button class="btn sm" id="kc" type="button">Copy</button></div></div>
      <div class="row2"><button class="btn w" id="kd" type="button">Done</button><button class="btn" id="rm" type="button">Redeem another</button></div></div>`;
    let sh=false;$("#a1").textContent=mask;$("#a1").onclick=()=>{sh=!sh;$("#a1").textContent=sh?k.key:mask};
    typeIn($("#kl"),prem(k.key),10,0,false);$("#kc").onclick=()=>copy(prem(k.key),"Premium script copied");$("#kd").onclick=closeP;$("#rm").onclick=redeem};
  $("#rg").onclick=go;rk.onkeydown=e=>{if(e.key==="Enter")go()};rk.focus()}

/* ---------- reset hwid (device link) ---------- */
const PCI=`<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,LPI=`<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M2 19h20"/></svg>`;
function hwid(){
  panel("Reset HWID",`<div class="dv" id="dv"><div class="dev a">${PCI}<small>Old PC</small></div><div class="lnk"><b></b><u></u></div><div class="dev b">${LPI}<small>New PC</small></div></div>
    <div class="vt" id="hs">Unbind your old PC so the script can bind to a new one.</div>
    <div id="fm"><div class="field"><label>License key</label><input type="text" id="hk" placeholder="Your key" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Email</label><input type="text" id="he" placeholder="you@example.com" autocomplete="off" spellcheck="false" inputmode="email"></div>
    <div class="field"><label>Confirm email</label><input type="text" id="hc" placeholder="you@example.com" autocomplete="off" spellcheck="false" inputmode="email"></div>
    <div class="err" id="hr"></div><button class="btn w" id="hg" type="button" style="width:100%">Break the link</button></div><div id="hres"></div>`,"hw");
  let busy=false;const hs=$("#hs"),dv=$("#dv"),say=t=>{hs.style.opacity=0;setTimeout(()=>{hs.textContent=t;hs.style.opacity=1},180)},alive=()=>ov.classList.contains("on")&&$("#dv");
  const fail=m=>{$("#hr").textContent=m;shake($("#pb"))};
  const go=async()=>{if(busy)return;
    const kv=norm($("#hk").value),k=CONFIG.keys.find(x=>norm(x.key)===kv),e1=$("#he").value.trim().toLowerCase(),e2=$("#hc").value.trim().toLowerCase();
    if(!kv)return fail("Enter your key first.");if(!k)return fail("That key isn't valid. Check it and try again.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e1))return fail(e1?"Enter a valid email address.":"Enter your email.");
    if(e1!==e2)return fail("The emails don't match.");
    busy=true;$("#hr").textContent="";try{const r=JSON.parse(ls.get("cloudy_hwid")||"{}");r[kv]={t:Date.now(),email:e1};ls.set("cloudy_hwid",JSON.stringify(r))}catch(e){}
    $("#fm").classList.add("off");dv.classList.add("scan");say("Checking your key");await wait(1100);if(!alive())return;
    say("Reading the old device");await wait(900);if(!alive())return;
    dv.classList.replace("scan","snap");say("Breaking the old link");spark($(".lnk"),["#f87171","#fff","#fbbf24"],26);await wait(1300);if(!alive())return;
    dv.classList.replace("snap","free");say("Ready for your new PC");spark($(".dev.b"),["#4ade80","#fff","#a6efe6"],30);await wait(900);if(!alive())return;
    $("#pt").textContent="HWID reset";$("#fm").remove();
    const row=(l,v,i)=>`<div class="kv rise" style="--k:${i}"><span class="mut">${l}</span><b>${esc(v)}</b></div>`;
    $("#hres").innerHTML=row("Key",k.key,0)+row("Email",e1.replace(/^(.).*(@.*)$/,"$1•••$2"),1)+row("Status","Unbound",2)+`<p class="rise" style="--k:3;margin-top:14px;text-align:center">Run the script on your new PC and it will bind to that device.</p><button class="btn w rise" style="--k:4;width:100%;margin-top:14px" id="hdn" type="button">Done</button>`;
    $("#hdn").onclick=closeP};
  $("#hg").onclick=go;[$("#hk"),$("#he"),$("#hc")].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});$("#hk").focus()}

/* ---------- changelog ---------- */
function changelog(){panel("Changelog",CONFIG.changelog.map((c,i)=>`<div class="cl rise" style="--k:${i}"><h4>${esc(c.v)}<small>${esc(c.date)}</small></h4><ul>${c.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join(""))}

$$("[data-m]").forEach(a=>a.onclick=e=>{e.preventDefault();location.hash="#/"+a.dataset.m});

/* ---------- scroll animation ---------- */
(function(){
  const bar=document.createElement("div");bar.id="sbar";document.body.append(bar);
  const dots=document.createElement("div");dots.id="sdots";dots.innerHTML=["Top","Features","Script","FAQ"].map((n,i)=>`<button type="button" data-i="${i}"><span>${n}</span><i></i></button>`).join("");document.body.append(dots);
  const db=[...dots.children];db.forEach(b=>b.onclick=()=>secs[b.dataset.i].scrollIntoView({behavior:"smooth"}));
  ["","Features","Script","Answers"].forEach((t,i)=>{if(!t)return;const g=document.createElement("div");g.className="gh";g.textContent=(t+" ").repeat(4);secs[i].append(g)});
  $$("main h2").forEach(h=>{let w=0;[...h.childNodes].forEach(n=>{if(n.nodeType!==3)return;const f=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(t=>{if(!t.trim()){f.append(t);return}const o=document.createElement("span"),i=document.createElement("span");o.className="wd";o.style.setProperty("--w",w++);i.textContent=t;o.append(i);f.append(o)});n.replaceWith(f)})});
  const rows=$$(".fr"),hc=$("#hc");let tk=0;
  const upd=()=>{tk=0;const y=scrollY,vh=innerHeight,max=document.documentElement.scrollHeight-vh;
    bar.style.transform=`scaleX(${max>0?y/max:0})`;
    const hp=Math.min(1,y/vh);hc.style.transform=`translateY(${y*.3}px) scale(${1-hp*.08})`;hc.style.opacity=Math.max(0,1-hp*1.2);hc.style.filter=hp>.02?`blur(${hp*7}px)`:"none";
    let cur=0;secs.forEach((s,i)=>{const r=s.getBoundingClientRect(),p=(vh-r.top)/(vh+r.height),g=s.querySelector(".gh");if(g)g.style.transform=`translate(${-p*45}%,-50%)`;if(r.top<=vh*.5)cur=i});
    db.forEach((b,i)=>b.classList.toggle("on",i===cur));
    let best=null,bd=1e9;rows.forEach(r=>{const b=r.getBoundingClientRect(),d=Math.abs(b.top+b.height/2-vh*.5);if(d<bd){bd=d;best=r}});rows.forEach(r=>r.classList.toggle("act",r===best&&bd<vh*.32))};
  addEventListener("scroll",()=>{if(!tk){tk=1;requestAnimationFrame(upd)}},{passive:true});addEventListener("resize",upd);upd();
})();

/* ---------- human check (runs on every load / refresh) ---------- */
let code="";
function drawCode(){const c=$("#cc"),x=c.getContext("2d"),A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";x.fillStyle="#000";x.fillRect(0,0,240,80);code="";
  for(let i=0;i<5;i++)code+=A[Math.random()*A.length|0];
  for(let i=0;i<8;i++){x.strokeStyle=`rgba(255,255,255,${.12+Math.random()*.25})`;x.beginPath();x.moveTo(Math.random()*240,Math.random()*80);x.bezierCurveTo(Math.random()*240,Math.random()*80,Math.random()*240,Math.random()*80,Math.random()*240,Math.random()*80);x.stroke()}
  for(let i=0;i<5;i++){x.save();x.translate(30+i*45,48+Math.random()*10-5);x.rotate(Math.random()*.7-.35);x.font=(34+(Math.random()*10|0))+"px Spectral,Georgia,serif";x.fillStyle=i%2?"#fff":"#a6efe6";x.textAlign="center";x.fillText(code[i],0,0);x.restore()}
  for(let i=0;i<70;i++){x.fillStyle="rgba(255,255,255,.35)";x.fillRect(Math.random()*240,Math.random()*80,1.5,1.5)}}
async function enter(){
  $("#gate").classList.add("out");await wait(500);$("#gate").remove();
  const ld=$("#ld");ld.classList.add("on");typeIn($("#lb"),CONFIG.storeName,90,.8,false);await wait(1900);
  ld.classList.add("out");document.body.classList.remove("lock");document.body.classList.add("in");setTimeout(()=>ld.remove(),600);
  await typeIn($("#h1"),CONFIG.hero.headline,48,1);await typeIn($("#sub"),CONFIG.hero.text,26,.5,false);
  route()}
$("#cb").onclick=async()=>{const b=$("#cb");if(b.classList.contains("spin")||b.classList.contains("ok"))return;
  b.classList.add("spin");await wait(1000);b.classList.remove("spin");b.classList.add("ok");sOk();await wait(350);
  $("#ch").hidden=false;drawCode();$("#ci").focus()};
$("#cn").onclick=()=>{drawCode();$("#ci").value="";$("#ci").focus()};
const verify=()=>{if(norm($("#ci").value)===code){sOk();enter()}else{sErr();$("#ce").textContent="Wrong code. Here is a new one.";shake($(".gbox"));drawCode();$("#ci").value=""}};
$("#cg").onclick=verify;$("#ci").onkeydown=e=>{if(e.key==="Enter")verify()};
</script>
</body>
