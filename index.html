 if(!id||!pw)return err("Enter your username or email and your password");
 const u=users().find(x=>x.k===id||x.e===id);
 if(!u||await hashPw(pw,u.s)!==u.h){if(++fails>=5){lock=Date.now()+30000;fails=0}return err("Incorrect username/email or password")}
