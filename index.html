</style>

    x.clearRect(0,0,c.width,c.height);t++;
    if(t<90&&t%12===0)spawn(Math.random()*innerWidth,-10,Math.PI/2,14);
    ps.forEach(p=>{p.vx*=.985;p.vy=p.vy*.985+.38;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(t>200)p.life-=.02;
      x.save();x.globalAlpha=Math.max(0,p.life);x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.r*2));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(t<300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })();
}

/* coming soon */
function launchTime(C){
  const len=(+C.hours||0)*36e5+(+C.minutes||0)*6e4,fixed=new Date(C.launchAt).getTime();
  if(C.launchAt&&!isNaN(fixed))return{start:fixed-len,end:fixed};
  const sig="cs:"+len;let s;try{s=JSON.parse(ls.get("mystical_cs")||"null")}catch(e){}
  if(!s||s.sig!==sig){s={sig,start:Date.now(),end:Date.now()+len};ls.set("mystical_cs",JSON.stringify(s))}
  return s;
}
function showSoon(){
  const C=CONFIG.comingSoon,T=launchTime(C);
  document.title=CONFIG.storeName+" — Coming soon";mount("soonT");
  $("sBadge").textContent=C.badge;$("sTitle").textContent=C.title;$("sHead").textContent=C.heading;$("sText").textContent=C.text;
  const p=n=>String(n).padStart(2,"0"),E={D:$("cD"),H:$("cH"),M:$("cM"),S:$("cS")};
  const set=(k,v)=>{const e=E[k];if(e.textContent!==v){e.textContent=v;e.classList.remove("f");void e.offsetWidth;e.classList.add("f")}};
  let done=false;const iv=setInterval(tick,1000);
  const leave=()=>{const m=document.querySelector(".soon");m.classList.add("out");setTimeout(()=>{ss.set("mk","1");boot(true)},800)};
  function tick(){
    const left=Math.max(0,T.end-Date.now()),s=Math.floor(left/1000);
    set("D",p(Math.floor(s/86400)));set("H",p(Math.floor(s%86400/3600)));set("M",p(Math.floor(s%3600/60)));set("S",p(s%60));
    $("sBar").style.width=Math.min(100,Math.max(0,(Date.now()-T.start)/(T.end-T.start)*100))+"%";
    if(left<=0&&!done){done=true;clearInterval(iv);if(C.autoUnlock!==false){confetti();setTimeout(confetti,700);setTimeout(leave,2000)}}
  }
  tick();
  $("devlink").onclick=()=>{$("devbox").classList.toggle("on");$("devkey").focus()};
  const tryKey=()=>{const i=$("devkey");if(norm(i.value)===norm(CONFIG.devKey)){done=true;clearInterval(iv);leave()}else{i.classList.remove("bad");void i.offsetWidth;i.classList.add("bad");i.select()}};
  $("devgo").onclick=tryKey;$("devkey").onkeydown=e=>{if(e.key==="Enter")tryKey()};
}

/* store */
function startSite(){
  mount("site");
  const sym={GBP:"£",USD:"$",EUR:"€"}[CONFIG.currency]||CONFIG.currency+" ";
  const money=v=>sym+Number(v).toFixed(2);
  document.title=CONFIG.storeName;
  $("h1").textContent=CONFIG.storeName;$("sub").textContent=CONFIG.tagline;
  $("lg").onerror=()=>{$("lg").hidden=true;$("lgs").hidden=false};
  const link=(id,url,name)=>{const a=$(id);if(url){a.href=url;a.target="_blank";a.rel="noopener"}else a.onclick=e=>{e.preventDefault();toast(name+" link coming soon")}};
  link("disc",CONFIG.discordLink,"Discord");link("docs",CONFIG.docsLink,"Documentation");
  if(CONFIG.tosLink){$("tl").href=CONFIG.tosLink}else $("tl").onclick=e=>{e.preventDefault();toast("Terms link coming soon")};

  const route=()=>{
    const buy=location.hash==="#/purchase",v=$(buy?"vBuy":"vHome");
    $("vHome").hidden=buy;$("vBuy").hidden=!buy;
    v.style.animation="none";void v.offsetWidth;v.style.animation="";
    document.querySelectorAll(".plan,.box,.nav .btn").forEach(n=>{n.style.animation="none";void n.offsetWidth;n.style.animation=""});
    scrollTo(0,0);
  };
  addEventListener("hashchange",route);

  const P=CONFIG.plans,wk=P.find(p=>p.days===7),mo=P.find(p=>p.best);
  const save=wk&&mo?Math.max(0,wk.price*4-mo.price):0;
  P.forEach(p=>{
    const c=el("div","plan"+(p.best?" best":"")),a=el("div","pa"),b=el("div","pb"),ul=el("ul");
    a.append(el("em","",p.tag),el("strong","",p.days),el("small","","DAYS"));
    [["Full "+CONFIG.storeName+" premium access",1],["Latest releases and updates",1],["Instant license key delivery",1],
     [p.days+" days without repurchasing",p.best],["Save "+money(save)+" vs. four weeks",p.best]].forEach(([t,ok])=>ul.append(el("li",ok?"":"no",t)));
    const pr=el("div","pr",money(p.price));pr.append(el("small","","  / "+p.per));
    const bt=el("button","btn p","Get "+(p.best?"Monthly":"Weekly"));bt.onclick=()=>askTos(p);
    b.append(el("h3","",p.name),el("small","",p.desc),pr,ul,bt);c.append(a,b);$("plans").append(c);
  });

  /* terms: tick box, wait 5s, accept */
  const T=$("tos"),ck=$("tc"),ac=$("ta"),bar=$("tbar");let tm=null,pick=null;
  const reset=()=>{clearInterval(tm);ac.disabled=true;ac.textContent="Accept";bar.classList.remove("go")};
  function askTos(p){pick=p;ck.checked=false;reset();T.showModal()}
  ck.onchange=()=>{
    reset();if(!ck.checked)return;
    let n=5;ac.textContent="Accept ("+n+")";void bar.offsetWidth;bar.classList.add("go");
    tm=setInterval(()=>{n--;if(n>0)ac.textContent="Accept ("+n+")";else{clearInterval(tm);ac.disabled=false;ac.textContent="Accept"}},1000);
  };
  $("tn").onclick=$("tx").onclick=()=>{reset();T.close()};
  T.addEventListener("click",e=>{if(e.target===T){reset();T.close()}});
  ac.onclick=()=>{if(ac.disabled)return;T.close();reset();openCheckout(pick)};

  /* paypal */
  const PP=String(CONFIG.paypalClientId||"").trim();
  const idProblem=()=>!PP||/YOUR|CLIENT_ID|PASTE|XXXX/i.test(PP)?"No PayPal client ID set in CONFIG.":(PP.toLowerCase()!=="sb"&&!/^[A-Za-z0-9_-]{40,120}$/.test(PP)?"That doesn't look like a PayPal Client ID. Make sure it isn't the Secret.":"");
  const inject=qs=>new Promise((res,rej)=>{
    const s=document.createElement("script");s.src="https://www.paypal.com/sdk/js?"+qs;s.async=true;
    const to=setTimeout(()=>{s.remove();rej("timeout")},15000);
    s.onload=()=>{clearTimeout(to);window.paypal&&window.paypal.Buttons?res():rej("init")};
    s.onerror=()=>{clearTimeout(to);s.remove();rej("blocked")};document.head.append(s);
  });
  let ppP=null;
  const loadPayPal=()=>{
    if(window.paypal&&window.paypal.Buttons)return Promise.resolve();
    if(ppP)return ppP;
    const id=encodeURIComponent(PP),cur=encodeURIComponent(CONFIG.currency);
    return ppP=inject(`client-id=${id}&currency=${cur}&intent=capture&components=buttons`).catch(()=>inject(`client-id=${id}&currency=${cur}`)).catch(r=>{ppP=null;throw r});
  };
  const D=$("dlg"),dHTML=$("dBody").innerHTML;let sel=null,tok=0;
  const closeD=()=>{tok++;D.close()};
  function showErr(title,list,retry){
    const m=$("msg");m.className="err";m.innerHTML="";m.append(el("h4","",title));
    if(list&&list.length){const u=el("ul");list.forEach(t=>u.append(el("li","",t)));m.append(u)}
    if(retry){const b=el("button","btn p","Retry");b.onclick=pay;m.append(b)}
  }
  function openCheckout(p){
    if(!$("dName"))$("dBody").innerHTML=dHTML;
    $("x").onclick=closeD;sel=p;
    $("dName").textContent=CONFIG.storeName+" · "+p.name;$("dProd").textContent=p.days+" days";$("dNow").textContent=money(p.price);
    if(!D.open)D.showModal();pay();
  }
  D.addEventListener("click",e=>{if(e.target===D)closeD()});
  async function pay(){
    const my=++tok,box=$("paypal");box.innerHTML="";$("msg").className="";$("msg").innerHTML="";
    const prob=idProblem();if(prob)return showErr("PayPal isn't set up",[prob],false);
    if(!navigator.onLine)return showErr("You're offline",["Reconnect and try again."],true);
    box.append(el("div","skel"));
    try{await loadPayPal()}catch(r){if(my!==tok)return;box.innerHTML="";
      return showErr("PayPal couldn't load",r==="timeout"?["PayPal took too long to respond. Check your connection."]:["An error occurred. Contact a staff member, or try refreshing or a different browser."],true)}
    if(my!==tok)return;box.innerHTML="";const p=sel;
    paypal.Buttons({
      style:{layout:"vertical",color:"white",shape:"rect",label:"pay",height:46},
      createOrder:(d,a)=>a.order.create({purchase_units:[{description:CONFIG.storeName+" - "+p.name,amount:{currency_code:CONFIG.currency,value:Number(p.price).toFixed(2)}}]}),
      onApprove:(d,a)=>a.order.capture().then(o=>{
        const b=$("dBody");b.innerHTML="";const w=el("div","done");
        w.innerHTML='<svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="25"/><path d="M17 29l8 8 14-16"/></svg>';
        w.append(el("h3","","Payment complete"),el("p","",`Your ${p.name} will be delivered shortly. Keep your order ID:`));
        const c=el("code","",o.id);c.title="Click to copy";c.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(o.id).then(()=>{c.textContent="Copied";setTimeout(()=>c.textContent=o.id,1200)});
        const cl=el("button","btn p","Done");cl.style.marginTop="16px";cl.onclick=closeD;w.append(c,cl);b.append(w);confetti();
        // TODO: deliver the key SERVER-SIDE after verifying o.id with PayPal's Orders API.
      }),
      onCancel:()=>{$("msg").className="";$("msg").textContent="Payment cancelled. You haven't been charged."},
      onError:()=>showErr("Payment error",["Nothing was charged. Please try again."],true)
    }).render("#paypal").catch(()=>showErr("PayPal buttons couldn't be shown",["Refresh the page and try again."],true));
  }
  route();
}

function boot(enter){
  const C=CONFIG.comingSoon||{};
  if(!enter&&C.enabled===true&&ss.get("mk")!=="1"&&launchTime(C).end>Date.now())return showSoon();
  startSite();
  if(enter)$("app").classList.add("enter");
}
boot();
</script>
