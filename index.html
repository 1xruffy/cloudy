/* ============================================================= */

const RAW=`
Closures|Inspect, create, classify, hook and restore Luau closures.
 checkcaller|checkcaller() → boolean|Returns true when the current thread was created by the executor.
 clonefunction|clonefunction(fn) → function|Creates a separate copy of a function that behaves the same.
 hookfunction|hookfunction(fn, hook) → function|Replaces a function with a hook and returns the original.
 restorefunction|restorefunction(fn) → ()|Removes a hook and restores the original function.
 isfunctionhooked|isfunctionhooked(fn) → boolean|Checks whether a function is currently hooked.
 newcclosure|newcclosure(fn) → function|Wraps a Luau function inside a C closure.
 iscclosure|iscclosure(fn) → boolean|Returns true if the function is a C closure.
 islclosure|islclosure(fn) → boolean|Returns true if the function is a Luau closure.
 isexecutorclosure|isexecutorclosure(fn) → boolean|Returns true if the function was created by the executor.
 loadstring|loadstring(source, chunkname?) → function|Compiles a string of Luau code into a callable function.
Debug|Inspect and modify constants, upvalues, stacks and prototypes.
 debug.getconstant|debug.getconstant(fn, index) → any|Returns the constant at the given index of a function.
 debug.getconstants|debug.getconstants(fn) → table|Returns every constant used by a function.
 debug.setconstant|debug.setconstant(fn, index, value) → ()|Changes a constant of a function.
 debug.getupvalue|debug.getupvalue(fn, index) → any|Returns the upvalue at the given index.
 debug.getupvalues|debug.getupvalues(fn) → table|Returns all upvalues of a function.
 debug.setupvalue|debug.setupvalue(fn, index, value) → ()|Changes an upvalue of a function.
 debug.getstack|debug.getstack(level, index?) → any|Reads values from the stack at a call level.
 debug.setstack|debug.setstack(level, index, value) → ()|Writes a value into the stack at a call level.
 debug.getproto|debug.getproto(fn, index, active?) → function|Returns a nested function prototype.
 debug.getprotos|debug.getprotos(fn) → table|Returns every nested prototype of a function.
 debug.getinfo|debug.getinfo(fn) → table|Returns information about a function such as source and line.
Drawing|Create and manage client-only 2D drawing objects.
 Drawing.new|Drawing.new(type) → Drawing|Creates a Line, Text, Image, Circle, Square, Quad or Triangle object.
 Drawing.Fonts|Drawing.Fonts → table|Lists the fonts available to Text drawing objects.
 isrenderobj|isrenderobj(obj) → boolean|Checks whether a value is a drawing object.
 getrenderproperty|getrenderproperty(obj, prop) → any|Reads a property of a drawing object.
 setrenderproperty|setrenderproperty(obj, prop, value) → ()|Sets a property of a drawing object.
 cleardrawcache|cleardrawcache() → ()|Removes all active drawing objects.
Encoding|Encode Base64 data and compress or decompress LZ4 data.
 crypt.base64encode|crypt.base64encode(data) → string|Encodes data as Base64.
 crypt.base64decode|crypt.base64decode(data) → string|Decodes Base64 data.
 lz4compress|lz4compress(data) → string|Compresses data with LZ4.
 lz4decompress|lz4decompress(data, size) → string|Decompresses LZ4 data to the given size.
Environment|Inspect executor environments, the registry and garbage-collected values.
 getgenv|getgenv() → table|Returns the global executor environment.
 getrenv|getrenv() → table|Returns the Roblox global environment.
 getreg|getreg() → table|Returns the Luau registry.
 getgc|getgc(includeTables?) → table|Returns garbage-collectable values, optionally including tables.
 filtergc|filtergc(type, options, returnOne?) → any|Searches garbage-collected values using a filter.
 getthreadidentity|getthreadidentity() → number|Returns the identity level of the current thread.
 setthreadidentity|setthreadidentity(identity) → ()|Sets the identity level of the current thread.
Filesystem|Read, write and organize files in the executor workspace.
 readfile|readfile(path) → string|Reads the contents of a file.
 writefile|writefile(path, content) → ()|Writes content to a file, replacing it.
 appendfile|appendfile(path, content) → ()|Adds content to the end of a file.
 loadfile|loadfile(path) → function|Loads a file as a callable chunk.
 listfiles|listfiles(folder) → table|Lists files and folders inside a folder.
 isfile|isfile(path) → boolean|Checks whether a path is a file.
 isfolder|isfolder(path) → boolean|Checks whether a path is a folder.
 makefolder|makefolder(path) → ()|Creates a folder.
 delfile|delfile(path) → ()|Deletes a file.
 delfolder|delfolder(path) → ()|Deletes a folder and everything in it.
Instances|Enumerate, reference, inspect and interact with Roblox Instances.
 getinstances|getinstances() → table|Returns every Instance that is still referenced.
 getnilinstances|getnilinstances() → table|Returns Instances whose parent is nil.
 cloneref|cloneref(instance) → Instance|Returns a reference copy of an Instance.
 compareinstances|compareinstances(a, b) → boolean|Checks whether two references point to the same Instance.
 gethui|gethui() → Instance|Returns a protected container for custom interfaces.
 fireclickdetector|fireclickdetector(detector, distance?) → ()|Triggers a ClickDetector.
 fireproximityprompt|fireproximityprompt(prompt) → ()|Triggers a ProximityPrompt.
 firetouchinterest|firetouchinterest(part, toTouch, state) → ()|Simulates a touch between two parts.
Metatable|Access, replace and inspect protected metatables.
 getrawmetatable|getrawmetatable(object) → table|Returns the real metatable even if it is protected.
 setrawmetatable|setrawmetatable(object, metatable) → ()|Replaces the metatable of an object.
 setreadonly|setreadonly(table, state) → ()|Turns the read-only state of a table on or off.
 isreadonly|isreadonly(table) → boolean|Checks whether a table is read-only.
 hookmetamethod|hookmetamethod(object, method, hook) → function|Hooks a metamethod and returns the original.
 getnamecallmethod|getnamecallmethod() → string|Returns the method name of the current namecall.
Miscellaneous|Utility functions for executor info, HTTP requests, clipboard and more.
 identifyexecutor|identifyexecutor() → name, version|Returns the executor name and version.
 request|request(options) → table|Sends an HTTP request and returns the response.
 setclipboard|setclipboard(text) → ()|Copies text to the clipboard.
 queue_on_teleport|queue_on_teleport(code) → ()|Runs code after the next teleport.
 setfpscap|setfpscap(fps) → ()|Sets the maximum frame rate.
Reflection|Read and modify hidden and non-scriptable properties.
 gethiddenproperty|gethiddenproperty(instance, prop) → value, isHidden|Reads a hidden property.
 sethiddenproperty|sethiddenproperty(instance, prop, value) → boolean|Writes a hidden property.
 isscriptable|isscriptable(instance, prop) → boolean|Checks whether a property is scriptable.
 setscriptable|setscriptable(instance, prop, state) → boolean|Changes whether a property is scriptable.
 getcallbackvalue|getcallbackvalue(instance, prop) → function|Returns the callback assigned to a property.
 getcustomasset|getcustomasset(path) → string|Returns an asset id for a file in the workspace.
Scripts|Inspect running scripts, bytecode, hashes and script environments.
 getscripts|getscripts() → table|Returns every script in the game.
 getloadedmodules|getloadedmodules() → table|Returns every loaded ModuleScript.
 getrunningscripts|getrunningscripts() → table|Returns scripts that are currently running.
 getscriptbytecode|getscriptbytecode(script) → string|Returns the bytecode of a script.
 getscripthash|getscripthash(script) → string|Returns a hash of the script source.
 getscriptclosure|getscriptclosure(script) → function|Returns a function that runs the script.
 getsenv|getsenv(script) → table|Returns the environment of a running script.
 getcallingscript|getcallingscript() → Instance|Returns the script that called the current function.
Signals|Inspect, fire and replicate signal connections.
 getconnections|getconnections(signal) → table|Returns the connections of a signal.
 firesignal|firesignal(signal, ...) → ()|Fires every connection of a signal.
 replicatesignal|replicatesignal(signal, ...) → ()|Replicates a signal to the server.
 Connection|connection:Fire() / Defer() / Enable() / Disable() / Disconnect()|Methods available on connection objects.
WebSocket|Open and manage WebSocket connections.
 WebSocket.connect|WebSocket.connect(url) → WebSocket|Opens a connection to a WebSocket server.
 socket:Send|socket:Send(message) → ()|Sends a message through the connection.
 socket:Close|socket:Close() → ()|Closes the connection.
 socket.OnMessage|socket.OnMessage:Connect(callback)|Fires when a message is received.
 socket.OnClose|socket.OnClose:Connect(callback)|Fires when the connection closes.
`;
const DOC=[];RAW.trim().split("\n").forEach(l=>{if(l[0]===" "){const[n,sg,d]=l.trim().split("|");DOC[DOC.length-1].f.push({n,sg,d})}else{const[t,d]=l.split("|");DOC.push({t,d,f:[]})}});

/* ---------- "click to enter" (only if the browser blocks sound) ---------- */

  const C=CONFIG.sound||{};if(!SFX.on||C.gate===false)return;
  SFX.unlock();await wait(80);if(SFX.ready()&&C.gate!==true)return;
  return new Promise(res=>{

    const go=async snd=>{if(done)return;done=true;if(snd)await SFX.unlock();else{SFX.mute();updSnd()}
      g.animate([{opacity:1},{opacity:0}],{duration:400,fill:"forwards"}).finished.then(()=>g.remove(),()=>g.remove());res()};
    g.onclick=()=>go(true);$("#gs").onclick=e=>{e.stopPropagation();go(false)};
    addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")go(true)},{once:true});

const snap=$("#snap"),secs=$$("#snap>.s");
(function(){
  const cv=$("#bg"),cx=cv.getContext("2d"),W=220,H=124;cv.width=W;cv.height=H;
  const hex=h=>{const n=parseInt(h.replace("#",""),16);return[n>>16&255,n>>8&255,n&255]};
  const P=CONFIG.palettes.map(p=>p.map(hex)),img=cx.createImageData(W,H),dots=$("#dots");
  secs.forEach((s,i)=>{const d=document.createElement("i");d.onclick=()=>snap.scrollTo({top:s.offsetTop,behavior:"smooth"});dots.append(d)});
  const D=[...dots.children];let pos=0,lastI=0;
  const target=()=>{const y=snap.scrollTop;let i=0;secs.forEach((s,k)=>{if(s.offsetTop<=y+2)i=k});
    const a=secs[i].offsetTop,n=secs[i+1];return n?i+Math.min(1,(y-a)/Math.max(1,n.offsetTop-a)):i};
  function frame(ms){
    const t=ms/1000*.35;pos+=(target()-pos)*.09;
    const i=Math.min(P.length-1,Math.floor(pos)),j=Math.min(P.length-1,i+1),f=Math.min(1,pos-i),
      d=P[i][0].map((v,k)=>v+(P[j][0][k]-v)*f),l=P[i][1].map((v,k)=>v+(P[j][1][k]-v)*f);
    const ri=Math.round(pos);D.forEach((e,k)=>e.classList.toggle("on",k===ri));if(ri!==lastI){lastI=ri;if(!document.body.classList.contains("pre"))SFX.play("section")}
    const a=img.data;let n=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const u=x/W*7,v=y/H*4.2;
      const w=Math.sin(u+t*1.3+2.2*Math.sin(v*1.4-t))+Math.sin(v*2.1+u*.6+t*.9+1.6*Math.sin(u*.8+t*.7))+.6*Math.sin((u+v)*1.7-t*1.1);
      let k=.5+.5*Math.sin(w*1.9);k=k*k*(3-2*k);
      a[n++]=d[0]+(l[0]-d[0])*k;a[n++]=d[1]+(l[1]-d[1])*k;a[n++]=d[2]+(l[2]-d[2])*k;a[n++]=255;
    }
    cx.putImageData(img,0,0);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  $$("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();snap.scrollTo({top:secs[a.dataset.go].offsetTop,behavior:"smooth"})});
})();

      bars.push(`<i style="--c:${SC[state]};animation-delay:${i*9}ms" title="${ago===0?"Today":ago+" day"+(ago===1?"":"s")+" ago"} · ${SL[state]}"></i>`)}

    s.style.cssText=`position:absolute;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:rgba(120,210,200,.45);pointer-events:none`;b.append(s);
    s.animate([{transform:"scale(0)",opacity:1},{transform:"scale(1)",opacity:0}],{duration:600,easing:"ease-out"}).finished.then(()=>s.remove())});
})();
/* sparkle trail, click shockwave, decrypting headings */
(function(){
  if(matchMedia("(pointer:fine)").matches){let last=0;
    addEventListener("pointermove",e=>{const n=performance.now();if(n-last<45)return;last=n;
      const s=document.createElement("i");s.className="spk";s.style.left=e.clientX+"px";s.style.top=e.clientY+"px";document.body.append(s);
      s.animate([{transform:"translate(0,0) scale(1)",opacity:.9},{transform:`translate(${(Math.random()-.5)*30}px,${14+Math.random()*24}px) scale(0)`,opacity:0}],{duration:800,easing:"ease-out"}).finished.then(()=>s.remove())},{passive:true})}
  document.addEventListener("pointerdown",e=>{const w=document.createElement("i");w.className="sw";w.style.left=e.clientX+"px";w.style.top=e.clientY+"px";document.body.append(w);
    w.animate([{transform:"scale(.3)",opacity:1},{transform:"scale(4)",opacity:0}],{duration:650,easing:"cubic-bezier(.1,.7,.3,1)"}).finished.then(()=>w.remove())});
  const ch="abcdefghijklmnopqrstuvwxyz#%&*";
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);
    const el=en.target,t=el.textContent,n=26;let f=0;
    (function s(){el.textContent=[...t].map((c,i)=>c===" "?c:i<f/n*t.length?c:ch[Math.random()*ch.length|0]).join("");if(f++<n)setTimeout(s,32);else el.textContent=t})()}),{root:snap,threshold:.5});
  ["#h2f","#h2","#h4"].forEach(s=>io.observe($(s)));
})();
route();
