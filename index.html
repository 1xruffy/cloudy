<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloudy.gg</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/cloudygg.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#3b82f6;--ac2:#7dd3fc;--ln:rgba(255,255,255,.1);--dim:rgba(255,255,255,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#000;color:#fff;font:15px/1.5 'DM Sans',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
::selection{background:var(--ac);color:#fff}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.5;animation:fl 16s ease-in-out infinite alternate}
.o1{width:520px;height:380px;left:50%;top:-120px;margin-left:-260px;background:rgba(59,130,246,.35)}
.o2{width:340px;height:340px;right:-80px;top:55%;background:rgba(14,116,244,.18);animation-delay:-6s}
.o3{width:300px;height:300px;left:-100px;top:30%;background:rgba(125,211,252,.12);animation-delay:-11s}
@keyframes fl{to{transform:translate(40px,60px) scale(1.15)}}
#pt{position:fixed;inset:0;z-index:0;pointer-events:none}
/* loader */
#ld{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;text-align:center;transition:opacity .7s,transform .7s;overflow:hidden}
#ld::before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.22),transparent 65%);animation:pu2 3s ease-in-out infinite}
@keyframes pu2{50%{transform:scale(1.2);opacity:.6}}
#ld.out{opacity:0;transform:scale(1.06);pointer-events:none}
.lw{position:relative;width:min(340px,86vw)}
.rg{position:relative;width:130px;height:130px;margin:0 auto 26px}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:3}.bgc{stroke:var(--ln)}
.fgc{stroke:url(#gd);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.rg .spin{position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(125,211,252,.3);animation:rot 8s linear infinite}
.rg .ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--ac2);transition:color .5s,transform .5s}
.rg .ic svg{width:44px;height:44px;transform:none;filter:drop-shadow(0 0 12px rgba(59,130,246,.7))}
.rg.done .ic{color:#4ade80;transform:scale(1.15)}.rg.done .fgc{stroke:#4ade80}
@keyframes rot{to{transform:rotate(360deg)}}
#lt{font-size:1.35rem;font-weight:700;min-height:1.7em;transition:opacity .25s,transform .25s}
#lt.sw{opacity:0;transform:translateY(8px)}
.ck{list-style:none;display:grid;gap:10px;margin:22px auto 0;text-align:left;width:fit-content}
.ck li{display:flex;align-items:center;gap:12px;font-size:.88rem;color:rgba(255,255,255,.35);transition:color .4s,transform .4s;transform:translateX(-6px)}
.ck li i{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;font-size:.7rem;transition:.3s}
.ck li.run{color:#fff;transform:none}.ck li.run i{border-color:var(--ac2);border-top-color:transparent;animation:rot .7s linear infinite}
.ck li.done{color:rgba(255,255,255,.85);transform:none}.ck li.done i{background:var(--ac);border-color:var(--ac);color:#fff;animation:pp .4s}.ck li.done i::before{content:"✓"}
@keyframes pp{50%{transform:scale(1.4)}}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac2),transparent);animation:sc 2.4s ease-in-out infinite;opacity:.5}
@keyframes sc{0%{top:0}100%{top:100%}}
/* layout */
.w{width:min(960px,92vw);margin:0 auto;position:relative;z-index:2}
nav{position:sticky;top:12px;z-index:50;margin-top:12px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border:1px solid var(--ln);border-radius:12px;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);animation:dn .8s .1s both cubic-bezier(.2,.9,.2,1)}
@keyframes dn{from{opacity:0;transform:translateY(-30px)}}
.lg{display:flex;align-items:center;gap:10px;font-weight:700}.lg img{height:24px;width:24px;border-radius:6px;object-fit:cover}
.nl{display:flex;align-items:center;gap:4px}
.nl a,.nl button{padding:7px 12px;border-radius:8px;border:0;background:none;font-size:.82rem;color:var(--dim);transition:.2s;position:relative}
.nl a:hover,.nl button:hover{color:var(--ac2);background:rgba(59,130,246,.1)}
.cb i{position:absolute;top:0;right:2px;min-width:16px;height:16px;border-radius:9px;background:var(--ac);color:#fff;font:700 .65rem/16px 'DM Sans';text-align:center;font-style:normal;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.cb i.on{transform:scale(1)}.cb i.bump{animation:bp .4s}
@keyframes bp{40%{transform:scale(1.7)}}
.hero{text-align:center;padding:70px 0 20px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,var(--ac2),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.hero p{max-width:560px;margin:14px auto 0;color:var(--dim)}.hero p b{color:#fff}
.st{display:flex;justify-content:center;align-items:center;gap:44px;margin:56px 0 44px}
.st b{display:block;font-size:clamp(2.2rem,6vw,3.2rem);letter-spacing:-.04em;line-height:1}.st small{color:var(--dim)}
.st hr{width:1px;height:46px;border:0;background:var(--ln)}
/* payment methods */
.pay{max-width:640px;margin:0 auto;padding:20px;border:1px solid var(--ln);border-radius:16px;background:linear-gradient(180deg,rgba(59,130,246,.08),transparent);position:relative;overflow:hidden}
.pay::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(125,211,252,.1),transparent);transform:skewX(-20deg);animation:swp 5s ease-in-out infinite}
@keyframes swp{60%,100%{left:140%}}
.pay h4{font-size:.85rem;font-weight:500;color:var(--dim);margin-bottom:14px}
.pcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:#000;text-align:left;transition:transform .3s,border-color .3s,box-shadow .3s;animation:bob 4s ease-in-out infinite;animation-delay:calc(var(--k)*.5s)}
@keyframes bob{50%{transform:translateY(-4px)}}
.mc:hover{border-color:var(--c);box-shadow:0 0 30px -4px var(--c);transform:translateY(-6px) scale(1.04);animation-play-state:paused}
.mc em{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:1rem;background:var(--c);box-shadow:0 0 18px -2px var(--c);flex:none;transition:transform .5s}
.mc:hover em{transform:rotate(360deg)}
.mc b{display:block;font-size:.88rem;line-height:1.2}.mc small{color:var(--dim);font-size:.72rem}
.pay p{margin-top:14px;font-size:.72rem;color:var(--dim)}
h2.t{font-size:1.2rem;margin:70px 0 16px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pc{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:#000;display:block;position:relative;transition:border-color .3s,box-shadow .4s,transform .15s}
.pc:hover{border-color:rgba(59,130,246,.7);box-shadow:0 0 50px rgba(59,130,246,.2)}
.pc::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(125,211,252,.16),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.pc:hover::after{opacity:1}
.pc .im{aspect-ratio:1;position:relative}
.pc img{position:absolute;inset:26px;width:calc(100% - 52px);height:calc(100% - 52px);object-fit:contain;transition:transform .5s cubic-bezier(.2,.9,.2,1)}
.pc:hover img{transform:scale(1.08)}
.pc .in{padding:12px 14px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:700}
.pc .in b{color:var(--ac2)}
.tg{position:absolute;top:10px;left:10px;z-index:2;padding:3px 10px;border-radius:99px;background:var(--ac);font-size:.68rem;font-weight:700}
/* product page */
.bk{display:inline-block;margin:26px 0 14px;color:var(--dim);font-size:.85rem;transition:.2s}.bk:hover{color:var(--ac2);transform:translateX(-4px)}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.box{border:1px solid var(--ln);border-radius:14px;background:#000}
.pi{aspect-ratio:1;position:relative;overflow:hidden;box-shadow:inset 0 0 80px rgba(59,130,246,.12)}
.pi img{position:absolute;inset:36px;width:calc(100% - 72px);height:calc(100% - 72px);object-fit:contain}
.pd{padding:24px}.pd h1{font-size:1.6rem}
.pr{color:var(--ac2);font-size:1.15rem;font-weight:700;margin:6px 0 10px}.pr s{color:var(--dim);font-weight:400;font-size:.9rem;margin-left:8px}
.ok{font-size:.76rem;color:#4ade80;display:flex;align-items:center;gap:6px;margin-bottom:14px}.ok.no{color:#f87171}
.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ds{font-size:.86rem;color:rgba(255,255,255,.8);display:grid;gap:3px}.ds b{color:#fff}.ds .g{margin-top:12px}
.vd{margin:18px 0 14px;padding-top:12px;border-top:1px solid var(--ln);font-size:.78rem}.vd small{color:var(--dim);font-size:.68rem;font-weight:700;letter-spacing:.06em}
.vd div{display:flex;justify-content:space-between;padding:6px 0;color:var(--dim)}.vd div span:last-child{color:var(--ac2)}
.buy{border-top:1px solid var(--ln);padding-top:16px;display:grid;gap:10px}
.ar{display:flex;gap:10px}
.q{display:flex;align-items:center;border:1px solid var(--ln);border-radius:9px}.q button{width:34px;height:42px;border:0;background:none;color:var(--dim)}.q button:hover{color:#fff}.q span{min-width:26px;text-align:center}
.bt{padding:12px 18px;border-radius:9px;border:1px solid var(--ac);background:rgba(59,130,246,.15);color:var(--ac2);font-weight:700;font-size:.88rem;position:relative;overflow:hidden;transition:transform .15s,box-shadow .3s,background .3s}
.bt:hover{box-shadow:0 0 30px rgba(59,130,246,.4);background:rgba(59,130,246,.28)}.bt:active{transform:scale(.96)}
.bt.f{flex:1}.bt.s{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#001;border:0;width:100%}.bt.s:hover{background:linear-gradient(90deg,var(--ac2),var(--ac))}
.bt:disabled{opacity:.4;pointer-events:none}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}@keyframes rpl{to{transform:scale(4);opacity:0}}
.fi{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--ln);background:#000;color:#fff;font:inherit;font-size:.88rem;transition:border-color .2s,box-shadow .2s}
.fi:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.2)}.fi.bad{border-color:#f87171;animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cf{display:flex;gap:8px}.cf .bt{padding:0 16px}
.cm{font-size:.76rem;min-height:1.1em;color:#4ade80}.cm.e{color:#f87171}
/* video (short) */
.vid{margin-top:80px;text-align:center}
.vid .fm{width:min(300px,86vw);aspect-ratio:9/16;margin:0 auto;border:1px solid var(--ln);border-radius:22px;overflow:hidden;box-shadow:0 0 80px rgba(59,130,246,.2)}.vid iframe{width:100%;height:100%;border:0}
footer{margin-top:80px;padding:30px 0 40px;border-top:1px solid var(--ln);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:.8rem;color:var(--dim)}
footer b{color:#fff;display:block;font-size:1rem;margin-bottom:4px}footer a{display:block;margin-bottom:5px}footer a:hover{color:var(--ac2)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--k,0)*90ms)}.rv.vis{opacity:1;transform:none}
/* drawer */
#sh{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .3s}#sh.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:71;background:#000;border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column}
#dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--ln)}.dh h3{font-size:1.1rem}
.dh button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:none;transition:transform .3s}.dh button:hover{transform:rotate(90deg);border-color:var(--ac)}
#db{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.ci img{width:52px;height:52px;object-fit:contain;border:1px solid var(--ln);border-radius:8px;padding:4px}.ci div{flex:1;font-size:.85rem}.ci small{color:var(--dim)}
.ci .q button{height:30px;width:28px}
.ft{margin-top:auto;padding-top:16px;display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;font-size:.85rem;color:var(--dim)}.kv b{color:#fff}.kv.d b{color:#4ade80}
.tt{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0}.tt b{font-size:1.5rem;color:var(--ac2)}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mt button{padding:12px 6px;border-radius:9px;border:1px solid var(--ln);background:none;font-size:.8rem;transition:.25s}.mt button:hover{transform:translateY(-3px)}.mt button.on{border-color:var(--ac);background:rgba(59,130,246,.12);color:var(--ac2)}.mt i{display:block;font-style:normal;font-size:1.2rem}
.ad{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 12px;border:1px solid var(--ln);border-radius:9px}.ad code{flex:1;font:.74rem ui-monospace,monospace;word-break:break-all;color:var(--ac2)}
.ad .bt{padding:6px 12px;font-size:.75rem}
.nt{margin-top:12px;padding:10px 12px;border-radius:9px;border:1px solid rgba(59,130,246,.3);font-size:.78rem;color:var(--dim);animation:up .4s both}
.em{text-align:center;color:var(--dim);padding:50px 0}
#ts{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);z-index:99;background:#000;border:1px solid var(--ac);padding:9px 18px;border-radius:99px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none}#ts.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.gr{grid-template-columns:1fr 1fr}.pp{grid-template-columns:1fr}.nl a.hm{display:none}.st{gap:26px}.pcs{grid-template-columns:1fr}}
@media(max-width:480px){.gr{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body class="lock">
<div id="ld"><div class="scan"></div><div class="lw">
  <div class="rg" id="rg"><div class="spin"></div>
    <svg viewBox="0 0 120 120"><defs><linearGradient id="gd"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient></defs><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fgc" id="rf" cx="60" cy="60" r="52"/></svg>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path id="ck2" d="M8.5 12l2.5 2.5 4.5-5"/></svg></div></div>
  <h2 id="lt">Checking your connection</h2>
  <ul class="ck" id="ck"></ul>
</div></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><canvas id="pt"></canvas>
<div class="w"><nav><a class="lg" href="#/"><img id="lgi" alt=""><span id="nm"></span></a><div class="nl" id="nl"></div></nav></div>
<div id="app"></div>
<div id="sh"></div><aside id="dr"><div class="dh"><h3 id="dt">Your Cart</h3><button id="dx" aria-label="Close">✕</button></div><div id="db"></div></aside>
<div id="ts"></div>
<script>
/* ======================= EDIT EVERYTHING HERE ======================= */
const C={
  name:"cloudy.gg",
  logo:"assets/cloudygg.png",
  currency:"£",
  discord:"https://discord.gg/cloudygg",
  youtube:"",   /* paste your YouTube Short link here, e.g. https://www.youtube.com/shorts/XXXXXXXXXXX */
  youtubeTitle:"See it in action",
  /* discount codes: "CODE": percent off */
  coupons:{"CLOUDY10":10,"CLOUDY5":5},
  nav:[
    {label:"Store",href:"#/"},
    {label:"Support",href:"https://discord.gg/cloudygg",ext:true}],
  hero:{title:"#1 Rivals Products",
    text:"Cloudy provides <b>Rivals scripts</b> built for speed and safety.<br><b>Fast updates, real support, instant delivery.</b>"},
  stats:[{n:100,suffix:"k+",l:"Orders Delivered"},{n:5,dec:2,suffix:"",star:true,l:"Rating"}],
  checkoutText:"Secure Checkout",
  checkoutNote:"Pay with Robux, Bitcoin or Litecoin. Delivered through a Discord ticket.",
  robuxPerGbp:165,
  methods:[   /* add more by copying a line */
    {id:"robux",name:"Robux",sub:"Gamepass",icon:"R$",color:"#16a34a"},
    {id:"btc",name:"Bitcoin",sub:"BTC",icon:"₿",color:"#f7931a",coin:"bitcoin",sym:"BTC",net:"Bitcoin network",addr:"bc1q0tmczvvnjn6svkwzjfqsp7cjdxlynccyjh22sw",dp:6},
    {id:"ltc",name:"Litecoin",sub:"LTC",icon:"Ł",color:"#345d9d",coin:"litecoin",sym:"LTC",net:"Litecoin network",addr:"ltc1qzjnlnwjvkyltemxxqvd7d6js20054jh2w0vmjs",dp:4}],
  productsTitle:"Our Products",
  /* ---- PRODUCTS: copy a whole { ... }, block to add a new one ---- */
  products:[
    {id:"cloudy",
     name:"Cloudy.gg",
     price:6,
     image:"assets/cloudygg.png",
     tag:"Best seller",
     stock:true,
     info:{"Edition":"Cloudy Lifetime","Supported Systems":"Windows 10 & 11","Payment Methods":"Robux, Bitcoin, Litecoin"},
     note:"Delivered instantly through a Discord ticket",
     features:["Smooth aim assist","Clean visuals","Movement options","Config system","Priority updates","Premium Discord role","Private support channel","2 FREE configs"],
     discounts:[{qty:2,pct:10}]}
  ],
  footer:{blurb:"The most advanced Rivals scripts on the market. Instant delivery, secure checkout and real support.",
    links:[{label:"Discord",href:"https://discord.gg/cloudygg"},{label:"Terms of Service",href:"#"},{label:"Privacy Policy",href:"#"},{label:"Refund Policy",href:"#"}]}
};
/* ==================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>C.currency+n.toFixed(2).replace(/\.00$/,"");
const toast=t=>{const e=$("#ts");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1900)};
const copy=(t,m)=>{const ok=()=>toast(m||"Copied");if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>0);else{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}};
const P=id=>C.products.find(p=>p.id===id);
let cart={},coupon="",email="";try{cart=JSON.parse(localStorage.getItem("cl_cart")||"{}");email=localStorage.getItem("cl_email")||""}catch(e){}
const save=()=>{try{localStorage.setItem("cl_cart",JSON.stringify(cart));localStorage.setItem("cl_email",email)}catch(e){}};
const pct=(p,q)=>(p.discounts||[]).reduce((a,d)=>q>=d.qty&&d.pct>a?d.pct:a,0);
const line=(p,q)=>p.price*q*(1-pct(p,q)/100);
const cpct=()=>C.coupons[coupon]||0;
const sub=()=>Object.entries(cart).reduce((a,[id,q])=>P(id)?a+line(P(id),q):a,0);
const total=()=>sub()*(1-cpct()/100);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const okEmail=()=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);

/* shared coupon + email fields */
const cpHtml=i=>`<div class="cf"><input class="fi" id="${i}c" placeholder="Coupon code" value="${esc(coupon)}" autocomplete="off" spellcheck="false" style="text-transform:uppercase"><button class="bt" id="${i}a" type="button">Apply</button></div><div class="cm" id="${i}m">${coupon?`✓ ${esc(coupon)} applied · ${cpct()}% off`:""}</div>`;
const emHtml=i=>`<input class="fi" id="${i}e" type="email" placeholder="Email address" value="${esc(email)}" autocomplete="email" spellcheck="false">`;
function bindCp(i,cb){const inp=$("#"+i+"c"),m=$("#"+i+"m"),go=()=>{const v=inp.value.trim().toUpperCase();
    if(!v){coupon="";m.textContent="";m.className="cm";cb();return}
    if(C.coupons[v]){coupon=v;m.className="cm";m.textContent=`✓ ${v} applied · ${C.coupons[v]}% off`;toast(C.coupons[v]+"% discount applied")}
    else{m.className="cm e";m.textContent="That code isn't valid.";inp.classList.remove("bad");void inp.offsetWidth;inp.classList.add("bad")}cb()};
  $("#"+i+"a").onclick=go;inp.onkeydown=e=>e.key==="Enter"&&go()}
function bindEm(i){const e=$("#"+i+"e");e.oninput=()=>{email=e.value.trim();e.classList.remove("bad");save()}}
function needEmail(i){if(okEmail())return true;const e=$("#"+i+"e");e.classList.remove("bad");void e.offsetWidth;e.classList.add("bad");e.focus();toast("Enter a valid email first");return false}

document.title=C.name;$("#nm").textContent=C.name;$("#lgi").src=C.logo;$("#lgi").onerror=e=>e.target.remove();
$("#nl").innerHTML=C.nav.map(n=>`<a href="${esc(n.href)}"${n.ext?' target="_blank" rel="noopener"':""}>${esc(n.label)}</a>`).join("")+`<button class="cb" id="cbtn" aria-label="Cart">🛒<i id="cn"></i></button>`;
function badge(bump){const n=count(),b=$("#cn");b.textContent=n;b.classList.toggle("on",n>0);if(bump){b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}}
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".bt");if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),i=document.createElement("i");i.className="rp";i.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.append(i);setTimeout(()=>i.remove(),600)});

/* views */
const yt=()=>{const m=(C.youtube||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:""};
const tail=()=>`${yt()?`<div class="vid rv"><h2 class="t" style="margin-top:0">${esc(C.youtubeTitle)}</h2><div class="fm"><iframe src="https://www.youtube-nocookie.com/embed/${yt()}?playsinline=1&rel=0" title="Video" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe></div></div>`:""}
  <footer class="rv"><div><b>${esc(C.name)}</b>${esc(C.footer.blurb)}</div><div><small>LINKS</small><br><br>${C.footer.links.map(l=>`<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div></footer>`;
function home(){
  return `<div class="w"><div class="hero"><h1 class="rv">${esc(C.hero.title)}</h1><p class="rv" style="--k:1">${C.hero.text}</p>
  <div class="st rv" style="--k:2">${C.stats.map((s,i)=>(i?"<hr>":"")+`<div><b data-n="${s.n}" data-d="${s.dec||0}" data-s="${esc(s.suffix||"")}">0</b><small>${esc(s.l)}${s.star?" ★":""}</small></div>`).join("")}</div>
  <div class="pay rv" style="--k:1"><h4>🔒 ${esc(C.checkoutText)}</h4><div class="pcs">${C.methods.map((m,i)=>`<div class="mc" style="--c:${m.color};--k:${i}"><em>${esc(m.icon)}</em><div><b>${esc(m.name)}</b><small>${esc(m.sub||"")}</small></div></div>`).join("")}</div><p>${esc(C.checkoutNote)}</p></div></div>
  <h2 class="t rv" id="products">${esc(C.productsTitle)}</h2>
  <div class="gr">${C.products.map((p,i)=>`<a class="pc rv" style="--k:${i}" href="#/p/${esc(p.id)}">${p.tag?`<span class="tg">${esc(p.tag)}</span>`:""}<div class="im"><img src="${esc(p.image)}" alt="${esc(p.name)}"></div><div class="in"><span>${esc(p.name.toUpperCase())}</span><b>${money(p.price)}</b></div></a>`).join("")}</div>${tail()}</div>`}
function product(id){const p=P(id);if(!p)return home();let q=1;
  const html=`<div class="w"><a class="bk" href="#/">← Back to store</a><div class="pp"><div class="box pi rv"><img src="${esc(p.image)}" alt=""></div>
  <div class="box pd rv" style="--k:1"><h1>${esc(p.name)}</h1><div class="pr"><span id="pr"></span><s id="po"></s></div><div class="ok${p.stock?"":" no"}">${p.stock?"In stock":"Out of stock"}</div>
  <div class="ds">${Object.entries(p.info||{}).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join("")}${p.note?`<div><b>${esc(p.note)}</b></div>`:""}
  <div class="g"><b>Features</b></div>${(p.features||[]).map(f=>`<div>${esc(f)}</div>`).join("")}</div>
  ${(p.discounts||[]).length?`<div class="vd"><small>VOLUME DISCOUNTS</small>${p.discounts.map(d=>`<div><span>${d.qty}+ units</span><span>${d.pct}% off</span></div>`).join("")}</div>`:'<div style="height:16px"></div>'}
  <div class="buy"><div class="ar"><div class="q"><button id="qm" type="button">−</button><span id="qv">1</span><button id="qp" type="button">+</button></div><button class="bt f" id="add" type="button"${p.stock?"":" disabled"}>Add to Cart</button></div>
  ${cpHtml("p")}${emHtml("p")}<button class="bt s" id="buy" type="button"${p.stock?"":" disabled"}>Buy Now</button></div></div></div>${tail()}</div>`;
  setTimeout(()=>{const u=()=>{const b=line(p,q),f=b*(1-cpct()/100);$("#qv").textContent=q;$("#pr").textContent=money(f);$("#po").textContent=f<p.price*q-.001?money(p.price*q):""};u();
    $("#qm").onclick=()=>{q=Math.max(1,q-1);u()};$("#qp").onclick=()=>{q=Math.min(99,q+1);u()};
    bindCp("p",u);bindEm("p");
    $("#add").onclick=()=>{cart[id]=(cart[id]||0)+q;save();badge(1);toast("Added to cart")};
    $("#buy").onclick=()=>{if(!needEmail("p"))return;cart[id]=(cart[id]||0)+q;save();badge(1);openDr("pay")}},0);
  return html}
function route(){const h=location.hash.replace(/^#\/?/,"");$("#app").innerHTML=h.startsWith("p/")?product(h.slice(2)):home();scrollTo(0,0);observe()}
addEventListener("hashchange",route);

let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("vis");io.unobserve(e.target);e.target.querySelectorAll("[data-n]").forEach(counter)}),{threshold:.15});
  $$(".rv").forEach(e=>io.observe(e));
  $$(".pc").forEach(c=>{c.onpointermove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.transform=`perspective(700px) rotateY(${(x-.5)*10}deg) rotateX(${(.5-y)*10}deg)`;c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%")};c.onpointerleave=()=>c.style.transform=""})}
function counter(el){const n=+el.dataset.n,d=+el.dataset.d,s=el.dataset.s,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1600);el.textContent=(n*(1-Math.pow(1-k,3))).toFixed(d)+s;if(k<1)requestAnimationFrame(f)})(t0)}

/* cart + checkout drawer */
const dr=$("#dr"),sh=$("#sh");
function openDr(mode){dr.classList.add("on");sh.classList.add("on");mode==="pay"?pay():cartView()}
function closeDr(){dr.classList.remove("on");sh.classList.remove("on")}
$("#cbtn").onclick=()=>openDr();$("#dx").onclick=closeDr;sh.onclick=closeDr;addEventListener("keydown",e=>e.key==="Escape"&&closeDr());
function cartView(){$("#dt").textContent="Your Cart";const ids=Object.keys(cart).filter(id=>P(id));
  if(!ids.length){$("#db").innerHTML=`<div class="em">Your cart is empty.<br><br><a class="bt" href="#/" onclick="closeDr()">Browse products</a></div>`;return}
  const s=sub(),d=s-total();
  $("#db").innerHTML=ids.map(id=>{const p=P(id),q=cart[id];return `<div class="ci"><img src="${esc(p.image)}" alt=""><div><b>${esc(p.name)}</b><br><small>${money(line(p,q))}${pct(p,q)?" · "+pct(p,q)+"% off":""}</small></div><div class="q"><button data-a="-" data-i="${id}">−</button><span>${q}</span><button data-a="+" data-i="${id}">+</button></div></div>`}).join("")+
  `<div class="ft"><div class="kv"><span>Subtotal</span><b>${money(s)}</b></div>${d>0?`<div class="kv d"><span>${esc(coupon)} (${cpct()}% off)</span><b>−${money(d)}</b></div>`:""}<div class="tt"><span>Total</span><b>${money(total())}</b></div>${cpHtml("d")}${emHtml("d")}<button class="bt s" id="co" type="button">Checkout</button><div class="kv" style="justify-content:center;font-size:.72rem">Secure checkout · pay with Robux, BTC or LTC</div></div>`;
  $$("#db .q button").forEach(b=>b.onclick=()=>{const i=b.dataset.i;cart[i]+=b.dataset.a==="+"?1:-1;if(cart[i]<=0)delete cart[i];save();badge();cartView()});
  bindCp("d",cartView);bindEm("d");$("#co").onclick=()=>{if(needEmail("d"))pay()}}
let mi=1,rates={};
function pay(){if(!count())return cartView();$("#dt").textContent="Checkout";const t=total(),m=C.methods[mi];let big,body;
  if(m.coin){const r=rates[m.coin],a=r?(t/r).toFixed(m.dp):null;big=a?`${a} ${m.sym}`:"Loading rate…";
    body=`<div class="ad"><code>${esc(m.addr)}</code><button class="bt" id="ca">Copy</button></div><div class="nt">Only send ${esc(m.sym)} on the <b>${esc(m.net)}</b>. ${a?"Live estimate, add a little extra for fees.":"Live rate unavailable, ask for the exact amount in your ticket."}</div>`}
  else{big="R$ "+Math.ceil(t*C.robuxPerGbp).toLocaleString();body=`<div class="nt">Open a ticket and ask for a Robux gamepass. We send a link for exactly this amount.</div>`}
  const items=Object.entries(cart).filter(([id])=>P(id)).map(([id,q])=>q+"x "+P(id).name).join(", ");
  $("#db").innerHTML=`<a href="#" id="bc" style="color:var(--dim);font-size:.85rem">← Back to cart</a><div class="mt" style="margin-top:14px">${C.methods.map((x,i)=>`<button data-i="${i}" class="${i===mi?"on":""}"><i>${esc(x.icon)}</i>${esc(x.name)}</button>`).join("")}</div>
  <div class="tt"><span>Send exactly<br><small style="color:var(--dim)">≈ ${money(t)}${coupon?" · "+esc(coupon):""}</small></span><b id="am" style="cursor:pointer">${esc(big)}</b></div>${body}
  <div class="nt">After paying, open a ticket on Discord with your proof (screenshot or TXID) and the email <b>${esc(email)}</b> to receive your product.</div>
  <div class="ft"><a class="bt s" style="display:block;text-align:center" href="${esc(C.discord)}" target="_blank" rel="noopener">Open Discord ticket</a><button class="bt" id="cm" style="width:100%">Copy order message</button></div>`;
  $("#bc").onclick=e=>{e.preventDefault();cartView()};
  $$(".mt button").forEach(b=>b.onclick=()=>{mi=+b.dataset.i;pay()});
  if($("#ca"))$("#ca").onclick=()=>copy(m.addr,m.name+" address copied");
  if(m.coin&&rates[m.coin])$("#am").onclick=()=>copy((t/rates[m.coin]).toFixed(m.dp),"Amount copied");
  $("#cm").onclick=()=>copy(`Hi, I paid for ${items} (${money(t)}${coupon?", code "+coupon:""}) with ${m.name}. Email: ${email}`,"Message copied")}
const cids=C.methods.filter(m=>m.coin).map(m=>m.coin).join(",");
if(cids)fetch("https://api.coingecko.com/api/v3/simple/price?ids="+cids+"&vs_currencies=gbp").then(r=>r.json()).then(j=>{Object.keys(j).forEach(k=>rates[k]=j[k].gbp);if(dr.classList.contains("on")&&$("#am"))pay()}).catch(()=>{});

/* particles */
(function(){const c=$("#pt"),x=c.getContext("2d");let W,H,P=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(70,W*H/20000|0)},()=>({x:Math.random()*W,y:Math.random()*H,v:Math.random()*.3+.1,r:Math.random()*1.4+.3}))};rs();addEventListener("resize",rs);
  (function f(){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}x.fillStyle="rgba(125,211,252,.5)";x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()}requestAnimationFrame(f)})()})();

/* loader: connection check, then site */
(async function(){const t=$("#lt"),ld=$("#ld"),rf=$("#rf"),ul=$("#ck");
  const steps=[["Checking your connection","Checking connection"],["Verifying your browser","Verifying browser"],["Securing your session","Securing session"]];
  ul.innerHTML=steps.map(s=>`<li><i></i>${s[1]}</li>`).join("");const lis=$$("#ck li");
  const say=x=>{t.classList.add("sw");return wait(200).then(()=>{t.textContent=x;t.classList.remove("sw")})};
  await wait(500);
  for(let i=0;i<steps.length;i++){
    if(i===0)while(!navigator.onLine){await say("No connection. Waiting…");await new Promise(r=>addEventListener("online",r,{once:true}))}
    await say(steps[i][0]);lis[i].className="run";await wait(i===1?1100:800);lis[i].className="done";rf.style.strokeDashoffset=327*(1-(i+1)/steps.length)}
  await wait(250);$("#rg").classList.add("done");await say("You're in. Welcome to "+C.name);await wait(750);
  badge();route();ld.classList.add("out");document.body.classList.remove("lock");setTimeout(()=>ld.remove(),800)})();
</script>
</body>
</html>
