<style>
:root{--bg:#000;--card:#000;--line:#1a1d20;--dim:#9fb0b8;--mute:#62747d;--acc:#22d3ee;--acc2:#3b82f6;--glow:rgba(34,211,238,.38);--rgb:34,211,238;--ok:#4ade80;--red:#f87171;--sans:"DM Sans","Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:#fff;font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
::selection{background:var(--acc);color:#000}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
[hidden]{display:none!important}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:.9rem;border:1px solid var(--line);background:#000;text-decoration:none;cursor:pointer;transition:background .2s,border-color .2s,transform .15s,box-shadow .2s}
.btn:hover:not(:disabled){background:#0a0a0a;border-color:rgba(var(--rgb),.5);box-shadow:0 0 24px -8px var(--glow);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled,.btn.off{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.p{background:#fff;border-color:#fff;color:#000}.btn.p:hover:not(:disabled){background:#dff7fc}
.btn svg{width:15px;height:15px;flex:none}
.btn.sm{padding:7px 12px;font-size:.78rem;border-radius:8px;gap:6px}.btn.sm svg{width:13px;height:13px}

/* ambient */
.amb{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(var(--rgb),.045) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--rgb),.045) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 72%);animation:pan 14s linear infinite}
@keyframes pan{to{background-position:56px 56px}}
.pt{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:var(--acc);opacity:0;box-shadow:0 0 10px var(--acc);animation:rise var(--d) linear var(--w) infinite}
@keyframes rise{10%{opacity:.8}100%{transform:translateY(-110vh) translateX(var(--x));opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(10px)}}
@keyframes sweep{to{background-position:-250% 0}}
@keyframes bob{50%{transform:translateY(-6px)}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
#app.enter{animation:enter 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:scale(.96);filter:blur(14px)}}

/* coming soon */
.soon{min-height:100vh;display:grid;place-items:center;padding:28px 20px;text-align:center}
.soon.out{animation:out .8s ease forwards}
@keyframes out{to{opacity:0;transform:scale(1.08);filter:blur(12px)}}
.soon h1{font-size:clamp(3rem,13vw,7.5rem);font-weight:800;letter-spacing:-.05em;line-height:1;background:linear-gradient(100deg,#fff 20%,var(--acc) 45%,var(--acc2) 55%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 6s linear infinite,up 1s both}
.badge{display:inline-flex;align-items:center;gap:9px;margin-bottom:22px;padding:7px 16px;border:1px solid rgba(var(--rgb),.4);background:rgba(var(--rgb),.08);border-radius:99px;font-size:.85rem;font-weight:600;animation:up 1s .1s both}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:ping 1.6s infinite;box-shadow:0 0 0 0 var(--acc)}
@keyframes ping{to{box-shadow:0 0 0 12px transparent}}
.soon h2{margin-top:18px;font-size:clamp(1.3rem,4vw,2rem);font-weight:700;letter-spacing:-.02em;animation:up 1s .25s both}
.soon .tx{margin:10px auto 0;max-width:46ch;color:var(--dim);animation:up 1s .35s both}
.cd{display:flex;justify-content:center;gap:clamp(8px,2.4vw,18px);margin-top:42px;animation:up 1s .5s both}
.u{width:clamp(66px,19vw,112px);padding:16px 0 12px;border:1px solid var(--line);border-radius:16px;background:#000;box-shadow:0 0 40px -14px var(--glow)}
.u b{display:block;font-size:clamp(1.9rem,8vw,3.4rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.u b.f{animation:flip .45s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{0%{transform:translateY(-55%);opacity:0;filter:blur(4px)}}
.u span{display:block;margin-top:8px;font-size:.72rem;color:var(--dim);font-weight:600}
.bar{width:min(440px,86%);height:5px;margin:34px auto 0;border-radius:9px;background:#0e0e0e;overflow:hidden;animation:up 1s .65s both}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 14px var(--acc);transition:width 1s linear}
.devlink{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:none;border:0;color:var(--mute);font-size:.72rem;cursor:pointer;padding:6px 12px}
.devbox{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);display:none;gap:8px;width:min(320px,90%)}
.devbox.on{display:flex}
.devbox input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#000;color:#fff;font:inherit}
.devbox input.bad{border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* views */
main{max-width:880px;margin:0 auto;padding:0 20px}
.view{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.home{text-align:center;padding-top:clamp(70px,20vh,170px);min-height:100vh;padding-bottom:70px}
.brand{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,24px)}
.logo{width:clamp(64px,12vw,110px);height:clamp(64px,12vw,110px);object-fit:contain;filter:drop-shadow(0 0 26px var(--glow));animation:bob 4s ease-in-out infinite}
.brand h1{font-size:clamp(2.8rem,10vw,5.6rem);font-weight:700;letter-spacing:-.045em;line-height:1;background:linear-gradient(100deg,#fff 20%,var(--acc) 50%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 7s linear infinite}
.sub{margin-top:14px;color:var(--dim);font-weight:500}
.nav{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:34px}
.nav .btn{animation:up .8s both}.nav .btn:nth-child(2){animation-delay:.1s}.nav .btn:nth-child(3){animation-delay:.2s}.nav .btn:nth-child(4){animation-delay:.3s}.nav .btn:nth-child(5){animation-delay:.4s}.nav .btn:nth-child(6){animation-delay:.5s}
.vid{position:relative;max-width:720px;margin:36px auto 0;aspect-ratio:16/9;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center;color:var(--dim);font-size:.9rem;animation:up .9s .35s both;transition:box-shadow .3s,border-color .3s}
.vid:hover{border-color:rgba(var(--rgb),.45);box-shadow:0 0 50px -16px var(--glow)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--mute);font-size:.72rem}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.rbx{width:100%;margin-top:8px}
.buy{padding:90px 0 40px}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bh b{font-size:.72rem;letter-spacing:.12em;font-weight:700;color:#cfdbe0}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 14px;transition:border-color .3s,box-shadow .3s,transform .3s;animation:up .8s both}
.plan:nth-child(2){animation-delay:.12s}
.plan:hover{border-color:rgba(var(--rgb),.5);box-shadow:0 14px 44px -18px var(--glow);transform:translateY(-4px)}
.pa{position:relative;height:130px;border-radius:10px;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.06),transparent 65%),#000;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.plan.best .pa{background:radial-gradient(circle at 50% 50%,rgba(var(--rgb),.22),transparent 65%),#000}
.pa em{position:absolute;top:10px;left:10px;font-style:normal;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:#1b2126;color:#b6c4ca}
.plan.best .pa em{background:rgba(var(--rgb),.2);color:var(--acc)}
.pa strong{font-size:4rem;font-weight:800;letter-spacing:-.05em;line-height:1;color:#d5dde1}
.pa small{font-size:.65rem;font-weight:700;letter-spacing:.08em;align-self:flex-end;margin-bottom:12px;color:var(--dim)}
.pb{padding:16px 8px 0}
.pb h3{font-size:1rem}.pb>small{color:var(--dim);font-size:.75rem}
.pr{margin:16px 0 14px;font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1}.pr small{font-size:.72rem;font-weight:500;color:var(--dim);letter-spacing:0}
.pb ul{list-style:none;display:grid;gap:7px;font-size:.75rem;color:#c8d4d9;margin-bottom:20px}
.pb li::before{content:"✓";color:var(--acc);margin-right:9px}.pb li.no{color:var(--mute)}.pb li.no::before{content:"✕";color:var(--mute)}
.pb .btn{width:100%}
.box{margin-top:10px;padding:14px 16px;background:var(--card);border-radius:12px;font-size:.72rem;color:var(--dim);animation:up .8s .25s both}
.box b{display:block;color:#fff;font-size:.78rem;margin-bottom:3px}
.pw{text-align:center;margin-top:22px;font-size:.7rem;color:var(--mute)}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
.stp{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid var(--line);border-radius:99px;font-size:.78rem;font-weight:600;background:#000}
.stp i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px currentColor;color:var(--ok);animation:blink 2s infinite}
.stp.updating i{background:#fbbf24;color:#fbbf24}.stp.down i{background:var(--red);color:var(--red)}
@keyframes blink{50%{opacity:.35}}
.sale{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:10px;padding:5px 6px 5px 14px;border:1px solid rgba(var(--rgb),.35);background:rgba(var(--rgb),.08);border-radius:99px;font-size:.8rem;font-weight:600;animation:glowp 3s ease-in-out infinite}
@keyframes glowp{50%{box-shadow:0 0 28px -4px var(--glow)}}
.sale b{color:var(--acc)}.sale .t{background:#000;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-variant-numeric:tabular-nums}
.pa .off{position:absolute;top:10px;right:10px;background:var(--acc);color:#000;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:99px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.pr s{font-size:1rem;font-weight:500;color:var(--mute);margin-right:8px;letter-spacing:0}
.stk{margin:-6px 0 14px;font-size:.74rem;color:var(--mute)}.stk.low{color:#fbbf24}
.rcard{max-width:480px;margin:28px auto 0;padding:28px;background:#000;border:1px solid var(--line);border-radius:16px;animation:up .8s both;box-shadow:0 0 60px -34px var(--glow)}
.rcard h2{font-size:1.4rem;letter-spacing:-.03em}.rcard p{color:var(--dim);font-size:.88rem;margin-top:4px}
#rk{width:100%;padding:13px 14px;margin:18px 0 8px;border-radius:10px;border:1px solid var(--line);background:#000;color:#fff;font:inherit;letter-spacing:.12em;text-align:center;text-transform:uppercase;transition:border-color .2s,box-shadow .2s}
#rk:focus{outline:none;border-color:rgba(var(--rgb),.6);box-shadow:0 0 24px -8px var(--glow)}
#rk.bad{border-color:var(--red);animation:shake .35s}
#rerr{min-height:1.4em;color:var(--red);font-size:.84rem;margin-bottom:8px}
.rinfo{margin:16px 0 20px;text-align:left}.rinfo div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}.rinfo span{color:var(--dim)}

/* status page */
.sp{max-width:680px;margin:0 auto}
.ssum,.srow,.sann{background:#0a0a0a;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.ssum{display:flex;align-items:center;gap:12px;margin-top:34px}
.ssum b{display:block;font-size:.9rem}.ssum small{font-size:.72rem;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
.srh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.85rem}
.srh em{margin-left:auto;font-style:normal;font-size:.72rem;color:var(--c)}
.srh span{color:var(--mute);font-size:.72rem}
.sbars{display:flex;gap:3px}.sbars i{flex:1;min-width:2px;height:14px;border-radius:3px;background:var(--c)}
.sbars i:hover{filter:brightness(1.3)}
.sann{border:1px solid rgba(var(--rgb),.35);font-size:.82rem;color:var(--dim)}.sann b{display:block;color:#fff;margin-bottom:2px}
.sleg{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.68rem;color:var(--dim)}
.sleg span{display:inline-flex;align-items:center;gap:6px;margin-right:12px}.sleg .dot{width:6px;height:6px;box-shadow:none}

/* dialogs */
dialog{margin:auto;width:min(430px,calc(100% - 32px));max-height:calc(100vh - 24px);overflow:auto;background:#000;color:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 30px 80px #000,0 0 60px -20px var(--glow)}
dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h3{font-size:1.2rem;letter-spacing:-.02em}.dh small{color:var(--dim)}
.x{border:1px solid var(--line);background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--dim);flex:none;transition:transform .25s}
.x:hover{transform:rotate(90deg);color:#fff}
.tp{margin:14px 0;color:var(--dim);font-size:.85rem}
.ck{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:.85rem}
.ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--acc);flex:none}
.tb{height:4px;border-radius:9px;background:#0e0e0e;margin:14px 0;overflow:hidden}.tb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tb i.go{animation:fill 5s linear forwards}@keyframes fill{to{width:100%}}
.ta{display:flex;gap:8px}.ta .btn{flex:1}
.dp{display:flex;align-items:baseline;gap:10px;margin:16px 0 14px}
.dp b{font-size:2.2rem;letter-spacing:-.03em;line-height:1}.dp s{color:var(--mute)}
.promo{display:flex;gap:8px}
.promo input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#000;color:#fff;font:inherit;font-size:.85rem;text-transform:uppercase}
.pm{min-height:1.3em;margin:6px 0 12px;font-size:.78rem;border-bottom:1px solid var(--line);padding-bottom:10px}
.coins{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.coins .btn.on{border-color:var(--acc);background:rgba(var(--rgb),.1)}
.addr{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.addr small{display:block;color:var(--dim);margin-bottom:6px;font-size:.75rem}
.addr code{display:block;word-break:break-all;font-size:.8rem;margin-bottom:10px;user-select:all}
.fine{margin-top:12px;color:var(--mute);font-size:.78rem;text-align:center}
#msg{margin-top:10px;font-size:.88rem;color:var(--dim)}
#msg.err{border:1px solid rgba(248,113,113,.5);background:rgba(248,113,113,.08);color:#fff;padding:12px 14px;border-radius:10px}
.done{text-align:center}.done svg{width:56px;height:56px}
.done circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:157;stroke-dashoffset:157;animation:dr .7s ease forwards}
.done path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s ease .6s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.done h3{font-size:1.4rem;margin:10px 0 6px}
.done p{color:var(--dim);font-size:.88rem}
.done code{display:block;margin-top:12px;padding:11px;background:#000;border:1px solid var(--line);border-radius:8px;cursor:pointer;word-break:break-all;font-size:.85rem}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);background:#000;border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:.85rem;opacity:0;transition:.3s;z-index:200;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.bk{position:fixed;top:14px;right:14px;z-index:70;animation:up .6s both;background:#000}

/* docs */
.dv{max-width:1280px;margin:0 auto;padding:0 20px 80px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
body.hasbk .dtop{padding-right:190px}
.dlogo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700}.dlogo img{height:26px}
.dsearch{position:relative;width:min(330px,60vw)}
.dsearch input{width:100%;padding:10px 64px 10px 14px;border-radius:10px;border:1px solid var(--line);background:#000;color:#fff;font:inherit;font-size:.82rem;transition:border-color .2s,box-shadow .2s}
.dsearch input:focus{outline:none;border-color:rgba(var(--rgb),.6);box-shadow:0 0 24px -8px var(--glow)}
.dsearch kbd,.lead kbd{font:inherit;font-size:.68rem;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.dsearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
#dres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:30;display:none}
#dres.on{display:block;animation:pop .2s both}
#dres a{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;font-size:.8rem;text-decoration:none}#dres a:hover{background:#0c0c0c;color:var(--acc)}#dres small{color:var(--mute)}
.dgrid{display:grid;grid-template-columns:240px minmax(0,1fr) 200px;gap:40px;align-items:start}
#dside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:8px 0}
#dside h4{font-size:.68rem;letter-spacing:.1em;font-weight:700;color:#cfdbe0;margin:18px 10px 8px}
#dside a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:.84rem;color:#c8d4d9;text-decoration:none;transition:background .2s,color .2s,transform .2s}
#dside a::before{content:"";width:8px;height:8px;border-radius:3px;background:#2a3338;transition:background .2s}
#dside a:hover{background:#0b0b0b;color:#fff;transform:translateX(3px)}
#dside a.on{background:#0e0e0e;color:#fff}#dside a.on::before,#dside a:hover::before{background:var(--acc)}
.dfoot{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:.72rem;color:var(--dim)}
#dside .dfoot a{display:inline;padding:0;color:var(--acc);background:none;transform:none}#dside .dfoot a::before{display:none}
#dmain{padding-top:34px;animation:up .6s both}
#dmain h1{font-size:clamp(2rem,5vw,2.8rem);letter-spacing:-.04em;line-height:1.1}
.lead{margin-top:14px;color:#c8d4d9;font-size:1.02rem;max-width:60ch}

/* confetti */
function confetti(){
  if(reduced)return;
  const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#22d3ee","#3b82f6","#ffffff","#a5f3fc","#60a5fa","#fbbf24","#f472b6"],ps=[];
  const spawn=(px,py,ang,n)=>{for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*1.1,v=9+Math.random()*13;ps.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],life:1})}};
  spawn(0,innerHeight,-Math.PI/3,110);spawn(innerWidth,innerHeight,-Math.PI*2/3,110);spawn(innerWidth/2,innerHeight*.4,-Math.PI/2,80);
  let t=0;(function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    if(t<90&&t%12===0)spawn(Math.random()*innerWidth,-10,Math.PI/2,14);
    ps.forEach(p=>{p.vx*=.985;p.vy=p.vy*.985+.38;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(t>200)p.life-=.02;
      x.save();x.globalAlpha=Math.max(0,p.life);x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.r*2));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(t<300)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })();
}

    }
    const lg=$("stLogo");lg.innerHTML="";
    if(SP.showLogo!==false){const im=el("img");im.src="assets/store.png";im.alt="";im.style.height="28px";im.onerror=()=>im.remove();lg.append(im)}
  }
  let stIv=null;

  /* docs */
  const Q=$("dq"),RES=$("dres");
  document.querySelectorAll(".dn").forEach(n=>n.textContent=CONFIG.storeName);
  function renderDocs(cat,fn){
    const C=DOC.find(c=>c.id===cat),S=CONFIG.storeName;
    $("dside").innerHTML='<h4>START</h4><a href="#/docs" class="'+(C?"":"on")+'">Introduction</a><h4>SUNC REFERENCE</h4>'+DOC.map(c=>`<a href="#/docs/${c.id}" class="${C&&C.id===c.id?"on":""}">${c.t}</a>`).join("")+'<div class="dfoot"><b>Related to sUNC docs</b><br><a href="https://docs.sunc.su" target="_blank" rel="noopener">Official reference ↗</a></div>';
    const m=$("dmain"),t=$("dtoc");m.style.animation="none";void m.offsetWidth;m.style.animation="";
    if(!C){
      m.innerHTML=`<h1>sUNC Documentation</h1><p class="lead">${S}'s API reference is related to and based exclusively on the official sUNC documentation.</p>
      <div class="dnote" id="src"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div><b>Official sUNC source</b>Only APIs documented and actively tested by sUNC are listed here. The canonical reference is <a href="https://docs.sunc.su" target="_blank" rel="noopener">docs.sunc.su</a>.</div></div>
      <h2 id="explore">Explore the sUNC reference</h2><p class="lead" style="font-size:.92rem">Browse the official sUNC surface or press <kbd>Ctrl K</kbd> to find a function.</p>
      <div class="dlab">SUNC REFERENCE</div><div class="dcards">${DOC.map(c=>`<a class="dcard" href="#/docs/${c.id}"><b>${c.t}</b><span>${c.d}</span></a>`).join("")}</div>`;
      t.innerHTML='<b>On this page</b><a data-t="src">sUNC source</a><a data-t="explore">Explore the reference</a>';
    }else{
      m.innerHTML=`<h1>${C.t}</h1><p class="lead">${C.d}</p><div class="dlab">${C.f.length} FUNCTIONS</div>`+C.f.map(f=>`<div class="fn" id="${fid(f.n)}"><h3>${f.n}</h3><p>${f.d}</p><pre><code></code></pre></div>`).join("");
      m.querySelectorAll("pre code").forEach((c,i)=>c.textContent=C.f[i].sg);
      t.innerHTML='<b>On this page</b>'+C.f.map(f=>`<a data-t="${fid(f.n)}">${f.n}</a>`).join("");
    }
    t.querySelectorAll("a").forEach(a=>a.onclick=()=>{const e=$(a.dataset.t);e&&e.scrollIntoView({behavior:"smooth",block:"start"})});
    if(fn){const e=$(fid(fn));if(e)setTimeout(()=>{e.scrollIntoView({block:"center"});e.classList.add("flash")},60)}
  }
  Q.oninput=()=>{
    const q=Q.value.trim().toLowerCase();if(!q){RES.classList.remove("on");return}
    const hit=[];DOC.forEach(c=>{if(c.t.toLowerCase().includes(q))hit.push([c.t,"Category","#/docs/"+c.id]);c.f.forEach(f=>{if(f.n.toLowerCase().includes(q))hit.push([f.n,c.t,"#/docs/"+c.id+"/"+f.n])})});
    RES.innerHTML="";hit.slice(0,8).forEach(h=>{const a=el("a");a.href=h[2];a.append(el("span","",h[0]),el("small","",h[1]));a.onclick=()=>{Q.value="";RES.classList.remove("on")};RES.append(a)});
    if(!hit.length)RES.append(el("a","","No results"));RES.classList.add("on");
  };
  Q.onblur=()=>setTimeout(()=>RES.classList.remove("on"),150);
  Q.onkeydown=e=>{if(e.key==="Escape"){Q.blur()}else if(e.key==="Enter"){const a=RES.querySelector("a[href]");if(a)a.click(),location.hash=a.getAttribute("href")}};

  /* browser page: status + stock + countdown */
  const B=CONFIG.browser||{},bMs=((+B.hours||0)*36e5+(+B.minutes||0)*6e4)||72e5;
  let bIv=null;
  {const a=$("bFree");if(B.freeLink)a.href=B.freeLink;else a.onclick=e=>{e.preventDefault();toast("Download link coming soon")}}
  if(B.premium){
    const bp=$("bpr"),pp=B.premium;
    if(onSale())bp.append(el("s","",money(pp.price)));
    bp.append(document.createTextNode(money(price(pp))),el("small","","  / "+pp.per));
    $("bBuy").onclick=()=>askTos(pp);
    const bs=["working","updating","down"].includes(B.status)?B.status:"working",go=bs==="working",
      tx=Object.assign({working:"Working",updating:"Updating",down:"Down"},B.statusText),
      out=pp.stock!=null&&pp.stock<=0;
    $("bstp").classList.add(bs);$("bstp").lastChild.textContent=tx[bs];
    $("bstk").className="stk"+(go&&!out&&pp.stock!=null&&pp.stock<=5?" low":"");
    $("bstk").textContent=!go?(B.statusNote||"Browser "+tx[bs].toLowerCase()):out?"Sold out":pp.stock==null?"In stock":pp.stock<=5?"Only "+pp.stock+" left":pp.stock+" in stock";
    if(!go||out){$("bBuy").disabled=true;$("bBuy").textContent=!go?tx[bs]:"Sold out"}
    if(!go){const f=$("bFree");f.classList.add("off");f.textContent=tx[bs]}
  }
  function browserTimer(on){
    clearInterval(bIv);if(!on)return;
    let s;try{s=JSON.parse(ls.get("mystical_browser")||"null")}catch(e){}
    const sig=String(bMs);
    if(!s||s.sig!==sig){s={sig,start:Date.now()};ls.set("mystical_browser",JSON.stringify(s))}
    const end=s.start+bMs,z=n=>String(n).padStart(2,"0"),gate=$("bGate"),pl=$("bPlans");
    let waited=false;
    const tick=()=>{
      const left=Math.max(0,end-Date.now()),q=Math.floor(left/1000);
      if(left<=0){clearInterval(bIv);gate.hidden=true;pl.hidden=false;if(waited)confetti();return}
      waited=true;gate.hidden=false;pl.hidden=true;
      $("bH").textContent=z(Math.floor(q/3600));$("bM").textContent=z(Math.floor(q%3600/60));$("bS").textContent=z(q%60);
      $("bBar").style.width=Math.min(100,Math.max(0,(Date.now()-s.start)/bMs*100))+"%";
    };
    tick();bIv=setInterval(tick,1000);
  }

  const route=()=>{
    if(!$("vHome"))return;
    const h=location.hash,docs=h.startsWith("#/docs"),buy=h==="#/purchase",red=h==="#/redeem",brw=h==="#/browser",sts=h==="#/status"&&SP.enabled!==false,
      v=$(docs?"vDocs":buy?"vBuy":red?"vRedeem":brw?"vBrowser":sts?"vStatus":"vHome");
    $("vHome").hidden=docs||buy||red||brw||sts;$("vBuy").hidden=!buy;$("vRedeem").hidden=!red;$("vBrowser").hidden=!brw;$("vStatus").hidden=!sts;$("vDocs").hidden=!docs;if(red)resetRedeem();
    browserTimer(brw);
    clearInterval(stIv);if(sts){renderStatus();stIv=setInterval(renderStatus,30000)}
    v.style.animation="none";void v.offsetWidth;v.style.animation="";
    document.querySelectorAll(".plan,.box,.nav .btn").forEach(n=>{n.style.animation="none";void n.offsetWidth;n.style.animation=""});
    scrollTo(0,0);
    if(docs){const p=h.split("/").map(decodeURIComponent);renderDocs(p[2],p[3])}
  };
  if(window._r)removeEventListener("hashchange",window._r);window._r=route;addEventListener("hashchange",route);

  /* back to countdown (dev access only) */
  document.querySelectorAll(".bk").forEach(b=>b.remove());document.body.classList.remove("hasbk");
  const CS=CONFIG.comingSoon||{},live=()=>ss.get("dev")==="1"&&CS.enabled===true&&launchTime(CS).end>Date.now();
  if(live()){
    const b=el("button","btn sm bk");b.type="button";
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to countdown';
    document.body.append(b);document.body.classList.add("hasbk");
    const off=()=>{clearInterval(iv);b.remove();document.body.classList.remove("hasbk")},iv=setInterval(()=>{if(!live()){off();ss.set("dev","")}},1000);
    b.onclick=()=>{off();ss.set("mk","");ss.set("dev","");document.querySelectorAll("dialog[open]").forEach(d=>d.close());boot()};
  }
  route();
}

function boot(enter){
  const C=CONFIG.comingSoon||{};
  if(!enter&&C.enabled===true&&ss.get("mk")!=="1"&&launchTime(C).end>Date.now())return showSoon();
  startSite();
  if(enter)$("app").classList.add("enter");
}
if(/[?&]reset/.test(location.search)){try{localStorage.removeItem("mystical_cs");localStorage.removeItem("mystical_browser");sessionStorage.removeItem("mk")}catch(e){}}
document.addEventListener("keydown",e=>{const q=$("dq");if(q&&$("vDocs")&&!$("vDocs").hidden&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();q.focus();q.select()}});
boot();
</script>
</body>
</html>
