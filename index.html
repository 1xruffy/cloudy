<style>

.lw{width:min(320px,86vw)}

/* drawer */
#sh{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:.3s}#sh.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(310px,100%);z-index:71;background:#050505;border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column}#dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px;border-bottom:1px solid var(--ln)}.dh h3{font-size:.85rem}.dh button{background:none;border:0;color:var(--dim);font-size:1rem}
#db{flex:1;overflow:auto;padding:10px 12px}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0}
.ci img{width:40px;height:40px;object-fit:contain;border:1px solid var(--ln);border-radius:8px;padding:3px;background:#000}
.ci .n{flex:1;font-size:.72rem;font-weight:700}.ci .n div{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:400}

.ft{padding:12px;border-top:1px solid var(--ln)}
.sr{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:6px}.sr b{font-size:.8rem}.sr.d{color:#22c55e}

.em{text-align:center;color:var(--dim);padding:50px 0;font-size:.8rem}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

.mt .mi{width:26px;height:26px}
.tt{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:.78rem}.tt b{font-size:1.2rem;color:var(--ac2);cursor:pointer}

.nt{margin-top:10px;padding:9px 11px;border-radius:9px;border:1px solid rgba(59,130,246,.25);font-size:.7rem;color:var(--dim)}
.fi{display:flex;align-items:center;margin-top:8px;border:1px solid var(--ln);border-radius:9px;background:#000;transition:.2s}.fi:focus-within{border-color:var(--ac)}
.fi input{flex:1;min-width:0;padding:11px 12px;background:none;border:0;outline:0;font-size:.74rem;color:#fff}.fi input::placeholder{color:var(--dim)}.fi .bt{margin:4px;padding:7px 12px;font-size:.68rem;border-radius:7px}
.ft .cm{margin:6px 0 0}
#ch{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);z-index:71;background:#050505;border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column}#ch.on{transform:none}
#ch .dh h3{display:flex;align-items:center;gap:8px}#ch .dh h3::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e}#ch .dh small{display:block;color:var(--dim);font-size:.62rem;font-weight:400;margin-top:1px}
#cmsg{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.78rem;line-height:1.45;white-space:pre-line}
.m.b{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);align-self:flex-start;border-bottom-left-radius:4px}

.m.ty{color:var(--dim);animation:bl 1s infinite}@keyframes bl{50%{opacity:.35}}
.m .bt{margin-top:8px;display:inline-block;padding:7px 12px;font-size:.7rem}
#cchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;max-height:116px;overflow:auto}
#cchips button{border:1px solid var(--ln);background:none;border-radius:99px;padding:6px 11px;font-size:.68rem;color:var(--dim);transition:.2s}#cchips button:hover{border-color:var(--ac);color:var(--ac2)}
.cinp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--ln)}.cinp .fi{flex:1;margin:0}.cinp .bt{padding:0 14px}
/* modal */
#md{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.75);display:none;place-items:center;padding:16px}#md.on{display:grid}
.mb{width:min(560px,100%);max-height:80vh;overflow:auto;background:#050505;border:1px solid var(--ln);border-radius:14px;padding:24px}
.mb h3{font-size:1.1rem;margin-bottom:4px}.mb .u{color:var(--dim);font-size:.7rem;margin-bottom:14px}.mb h4{font-size:.85rem;margin:16px 0 4px;color:var(--ac2)}.mb p{color:rgba(255,255,255,.75);font-size:.8rem}
.mb .bt{margin-top:20px;width:100%}
#ts{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);z-index:99;background:#000;border:1px solid var(--ac);padding:8px 16px;border-radius:99px;font-size:.8rem;opacity:0;transition:.3s;pointer-events:none}#ts.on{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.rv.vis{opacity:1;transform:none}
@media(max-width:760px){.gr{grid-template-columns:1fr 1fr}.pp{grid-template-columns:1fr}.nl .tx{display:none}}
@media(max-width:480px){.gr{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

<script>
/* ======================= EDIT EVERYTHING HERE ======================= */
const C={
  name:"cloudy.gg", logo:"assets/cloudygg.png", currency:"£",
  discord:"https://discord.gg/cloudygg",
  youtube:"https://www.youtube.com/shorts/ikpwTJ3t6Ow", youtubeTitle:"See it in action",
  codes:{CLOUDY10:10,CLOUDY5:5},
  hero:{title:"#1 Rivals Products",text:"Cloudy provides <b>Rivals scripts</b> built for speed and safety.<br><b>Fast updates, real support, instant delivery.</b>"},
  stats:[{n:100,suffix:"k+",l:"Orders Delivered"},{n:5,dec:2,suffix:"",l:"Rating ★"}],
  robuxPerGbp:165,
  /* put real logos at these paths (png/svg). If a file is missing, a built-in icon is used */
  methods:[
    {id:"robux",name:"Robux",img:""},
    {id:"btc",name:"Bitcoin",img:"",coin:"bitcoin",sym:"BTC",net:"Bitcoin network",addr:"bc1q0tmczvvnjn6svkwzjfqsp7cjdxlynccyjh22sw",dp:6},
    {id:"ltc",name:"Litecoin",img:"",coin:"litecoin",sym:"LTC",net:"Litecoin network",addr:"ltc1qzjnlnwjvkyltemxxqvd7d6js20054jh2w0vmjs",dp:4}],
  products:[{id:"cloudy",name:"Cloudy.gg",price:6,image:"assets/cloudygg.png",tag:"Best seller",stock:true,
    info:{"Edition":"Cloudy Lifetime","Supported Systems":"Windows 10 & 11","Payment Methods":"Robux, Bitcoin, Litecoin"},
    note:"Delivered instantly through a Discord ticket",
    features:["Smooth aim assist","Clean visuals","Movement options","Config system","Priority updates","Premium Discord role","Private support channel","U get 2 FREE Configs (Legit, Rage)"],
    discounts:[{qty:2,pct:10}]}],
  footer:{blurb:"The most advanced Rivals scripts on the market. Instant delivery, secure checkout and 24/7 support."},
  legal:{
   "Terms of Service":["Last updated: 2026",["Acceptance","By buying from "+"cloudy.gg you agree to these terms. If you do not agree, do not purchase."],["Digital products","All products are digital and delivered through a Discord ticket after payment is confirmed. Licences are for one person and may not be resold or shared."],["Use at your own risk","Using third-party software in online games can lead to account actions by the game. You are responsible for how you use our products."],["Support","Support is provided through our Discord server. Opening a ticket with proof of payment is required for delivery."],["Changes","We may update products, prices and these terms at any time."]],
   "Privacy Policy":["Last updated: 2026",["What we collect","Your email address (used for your order) and the payment proof you send us in a ticket. Your cart is stored only in your browser."],["How we use it","To deliver your order, give support and prevent fraud. We never sell your data."],["Third parties","Crypto prices come from CoinGecko, videos from YouTube, and tickets run through Discord. Each has its own privacy policy."],["Your rights","Ask us in Discord to delete your order data at any time."]],
   "Refund Policy":["Last updated: 2026",["Digital goods","Because products are delivered instantly, all sales are final once the product has been delivered."],["When we refund","If the product does not work and our support team cannot fix it within a reasonable time, you can request a refund in your ticket."],["When we don't","No refunds for bans, changed your mind, or misuse of the product."],["How to ask","Open a ticket on Discord with your order details. Approved refunds are returned in the same method you paid with."]]}
};
/* ==================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>C.currency+n.toFixed(2);
const toast=t=>{const e=$("#ts");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1900)};
const copy=(t,m)=>{const ok=()=>toast(m||"Copied");if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>0);else{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}};
const P=id=>C.products.find(p=>p.id===id);
let cart={},coupon="",email="";
try{cart=JSON.parse(localStorage.getItem("cl_cart")||"{}");coupon=localStorage.getItem("cl_cp")||"";email=localStorage.getItem("cl_em")||""}catch(e){}
if(!C.codes[coupon])coupon="";
const save=()=>{try{localStorage.setItem("cl_cart",JSON.stringify(cart));localStorage.setItem("cl_cp",coupon);localStorage.setItem("cl_em",email)}catch(e){}};
const vp=(p,q)=>(p.discounts||[]).reduce((a,d)=>q>=d.qty&&d.pct>a?d.pct:a,0);
const line=(p,q)=>p.price*q*(1-vp(p,q)/100);
const sub=()=>Object.entries(cart).reduce((a,[id,q])=>P(id)?a+line(P(id),q):a,0);
const cpPct=()=>C.codes[coupon]||0;
const total=()=>sub()*(1-cpPct()/100);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function tryCode(v){v=v.trim().toUpperCase();if(!v)return {ok:false,msg:"Enter a code"};if(!C.codes[v])return {ok:false,msg:"Invalid coupon code"};coupon=v;save();return {ok:true,msg:v+" applied: "+C.codes[v]+"% off"}}

/* payment logos: hand-drawn vectors. To use official PNGs set img:"assets/x.png" on a method */
const S=b=>"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">'+b+'</svg>');
const ico={
 robux:S('<circle cx="16" cy="16" r="16" fill="#16a34a"/><path d="M16 6.5l8.2 4.75v9.5L16 25.5l-8.2-4.75v-9.5z" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 11.5l3.9 2.25v4.5L16 20.5l-3.9-2.25v-4.5z" fill="#fff"/>'),
 btc:S('<circle cx="16" cy="16" r="16" fill="#f7931a"/><g transform="rotate(14 16 16)" stroke="#fff" stroke-width="2.4" fill="none" stroke-linejoin="round"><path d="M12 9h5.6a3.2 3.2 0 010 6.4H12M12 15.4h6.4a3.4 3.4 0 010 6.8H12M12 9v13.2M14.6 6v3M18 6v3M14.6 22.2v3M18 22.2v3"/></g>'),
 ltc:S('<circle cx="16" cy="16" r="16" fill="#345d9d"/><path d="M13.5 8h4.3l-2.3 10.4h6.3l-1 4H10.5z" fill="#fff"/><path d="M10 16.4l9.4-3.6" stroke="#fff" stroke-width="1.9" fill="none"/>')};
const mim=m=>`<img class="mi" src="${m.img?esc(m.img):ico[m.id]}" alt="${esc(m.name)}" data-k="${m.id}" onerror="this.onerror=null;this.src=ico[this.dataset.k]">`;

/* head + nav */
document.title=C.name;$("#nm").textContent=C.name;$("#lnm").textContent=C.name;
[$("#lgi"),$("#lli")].forEach(i=>{i.src=C.logo;i.onerror=()=>i.remove()});
const I={st:'<svg viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16"/></svg>',al:'<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>',su:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 4M12 17v.1"/></svg>',ac:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'};
$("#nl").innerHTML=`<a href="#/">${I.st}<span class="tx">Store</span></a><a href="#/products">${I.al}<span class="tx">All Products</span></a><button id="sup">${I.su}<span class="tx">Support</span></button><button class="acc" id="acb">${I.ac}<span class="tx">Account</span></button><button class="cb" id="cbtn" aria-label="Cart">🛒<i id="cn"></i></button>`;
function badge(){const n=count(),b=$("#cn");b.textContent=n;b.classList.toggle("on",n>0)}

/* modal */
function legal(k){const d=C.legal[k];$("#mb").innerHTML=`<h3>${esc(k)}</h3><div class="u">${esc(d[0])}</div>${d.slice(1).map(s=>`<h4>${esc(s[0])}</h4><p>${esc(s[1])}</p>`).join("")}<button class="bt" onclick="closeMd()">Close</button>`;$("#md").classList.add("on")}
function closeMd(){$("#md").classList.remove("on")}
$("#md").onclick=e=>{if(e.target.id==="md")closeMd()};
$("#acb").onclick=()=>{$("#mb").innerHTML=`<h3>Account</h3><div class="u">No sign up needed</div><p>Orders are delivered through a Discord ticket, so you don't need an account. Keep your payment proof and join our Discord for support and your product.</p><a class="bt s" href="${esc(C.discord)}" target="_blank" rel="noopener">Join Discord</a><button class="bt" onclick="closeMd()">Close</button>`;$("#md").classList.add("on")};

/* views */
const ytid=()=>{const m=(C.youtube||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:""};
const tail=()=>`${ytid()?`<div class="vid rv"><h2>${esc(C.youtubeTitle)}</h2><div class="fm"><iframe src="https://www.youtube-nocookie.com/embed/${ytid()}?rel=0&playsinline=1" title="Video" allow="encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe></div></div>`:""}
<footer class="rv"><div class="fr"><div><b>${esc(C.name)}</b><p>${esc(C.footer.blurb)}</p><div class="fs"><a href="${esc(C.discord)}" target="_blank" rel="noopener" aria-label="Discord"><svg viewBox="0 0 24 24"><path d="M19.3 5.3A17 17 0 0015 4l-.2.4a13 13 0 013.7 1.8 14 14 0 00-13 0A13 13 0 019.2 4.4L9 4a17 17 0 00-4.3 1.3C2 9.3 1.3 13.200 1.7 17a17 17 0 005.2 2.6l1.1-1.800a11 11 0 01-1.700-.8l.4-.3a12 12 0 0010.6 0l.4.3c-.5.3-1.1.6-1.700.8l1.1 1.800a17 17 0 005.2-2.600c.5-4.4-.8-8.300-3-11.700zM8.700 14.700c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm6.600 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg></a><a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M22 8a3 3 0 00-2-2c-1.800-.5-8-.5-8-.5s-6.200 0-8 .5A3 3 0 002 8c-.5 1.800-.5 4-.5 4s0 2.200.5 4a3 3 0 002 2c1.800.5 8 .5 8 .5s6.200 0 8-.5a3 3 0 002-2c.5-1.800.5-4 .5-4s0-2.200-.5-4zM10 15V9l5 3-5 3z"/></svg></a></div></div>
<div class="fl"><small>LINKS</small>${Object.keys(C.legal).map(k=>`<button onclick="legal('${k}')">${esc(k)}</button>`).join("")}</div></div>
<div class="cr"><span>© ${new Date().getFullYear()} ${esc(C.name)}</span><span>All rights reserved</span></div></footer>`;
function home(){return `<div class="w"><div class="hero"><h1 class="rv">${esc(C.hero.title)}</h1><p class="rv">${C.hero.text}</p>
<div class="st rv">${C.stats.map((s,i)=>(i?"<hr>":"")+`<div><b data-n="${s.n}" data-d="${s.dec||0}" data-s="${esc(s.suffix||"")}">0</b><small>${esc(s.l)}</small></div>`).join("")}</div>
<div class="sec rv">🔒 Secure Checkout</div><div class="pm rv">${C.methods.map(m=>`<span class="pill">${mim(m)}${esc(m.name)}</span>`).join("")}</div><div class="sec rv" style="opacity:.6;font-size:.7rem">We accept Robux, Bitcoin and Litecoin</div></div>
<h2 class="t rv" id="products">Our Products</h2>
<div class="gr">${C.products.map(p=>`<a class="pc rv" href="#/p/${esc(p.id)}">${p.tag?`<span class="tg">${esc(p.tag)}</span>`:""}<div class="im"><img src="${esc(p.image)}" alt="${esc(p.name)}"></div><div class="in"><span>${esc(p.name.toUpperCase())}</span><b>${money(p.price)}</b></div></a>`).join("")}</div>${tail()}</div>`}
let upd=()=>{};
function product(id){const p=P(id);if(!p)return home();let q=1;
 const html=`<div class="w"><div class="pp"><div class="box pi"><img src="${esc(p.image)}" alt="${esc(p.name)}"></div>
<div class="box pd"><h1>${esc(p.name)}</h1><div class="pr" id="pr"></div><div class="ok${p.stock?"":" no"}">${p.stock?"In stock":"Out of stock"}</div>
<div class="ds">${Object.entries(p.info||{}).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join("")}${p.note?`<div><b>${esc(p.note)}</b></div>`:""}<div class="g"><b>Features</b></div>${(p.features||[]).map(f=>`<div>${esc(f)}</div>`).join("")}</div>
${(p.discounts||[]).length?`<div class="vd"><small>VOLUME DISCOUNTS</small>${p.discounts.map(d=>`<div><span>${d.qty}+ units</span><span>${d.pct}% off</span></div>`).join("")}</div>`:'<div style="height:14px"></div>'}

<div class="ar"><div class="q"><button id="qm">−</button><span id="qv">1</span><button id="qp">+</button></div><button class="bt f" id="add"${p.stock?"":" disabled"}>Add to Cart</button></div>
<button class="bt s" id="buy"${p.stock?"":" disabled"}>Buy Now</button></div></div>${tail()}</div>`;
 setTimeout(()=>{
  upd=()=>{const f=line(p,q)*(1-cpPct()/100);$("#qv").textContent=q;$("#pr").textContent=money(f)+(f<p.price*q?" (saving "+money(p.price*q-f)+")":"")};
  $("#qm").onclick=()=>{q=Math.max(1,q-1);upd()};$("#qp").onclick=()=>{q=Math.min(99,q+1);upd()};
  const a=()=>{cart[id]=(cart[id]||0)+q;save();badge();openDr()};$("#add").onclick=a;$("#buy").onclick=a;upd()},0);
 return html}
function route(){upd=()=>{};const h=location.hash.replace(/^#\/?/,"");
 $("#app").innerHTML=h.startsWith("p/")?product(h.slice(2)):home();scrollTo(0,0);
 if(h==="products")setTimeout(()=>$("#products")?.scrollIntoView({behavior:"smooth"}),60);observe()}
addEventListener("hashchange",route);
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("vis");io.unobserve(e.target);e.target.querySelectorAll("[data-n]").forEach(counter)}),{threshold:.1});$$(".rv").forEach(e=>io.observe(e))}
function counter(el){const n=+el.dataset.n,d=+el.dataset.d,s=el.dataset.s,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1400);el.textContent=(n*(1-Math.pow(1-k,3))).toFixed(d)+s;if(k<1)requestAnimationFrame(f)})(t0)}

/* cart + checkout drawer */
const dr=$("#dr"),sh=$("#sh");
function openDr(m){$("#ch").classList.remove("on");dr.classList.add("on");sh.classList.add("on");m==="pay"?pay():cartView()}
function closeDr(){$("#ch").classList.remove("on");dr.classList.remove("on");sh.classList.remove("on")}
$("#cbtn").onclick=()=>openDr();$("#dx").onclick=closeDr;sh.onclick=closeDr;addEventListener("keydown",e=>{if(e.key==="Escape"){closeDr();closeMd()}});
function cartView(){$("#dt").textContent="Your Cart";const db=$("#db");db.style.cssText="";
 if(!Object.keys(cart).some(id=>P(id))){db.innerHTML=`<div class="em">Your cart is empty.<br><br><a class="bt" href="#/" onclick="closeDr()">Browse products</a></div>`;return}
 db.style.cssText="display:flex;flex-direction:column;padding:0";
 db.innerHTML=`<div id="ci" style="flex:1;overflow:auto;padding:10px 12px"></div><div class="ft"><div id="sum"></div>
 <div class="fi"><input id="cc" placeholder="Coupon code" value="${esc(coupon)}" autocomplete="off" spellcheck="false"><button class="bt sm" id="ca2">Apply</button></div><div class="cm" id="cmg"></div>
 <div class="fi"><input id="ce" type="email" placeholder="Email address" value="${esc(email)}" autocomplete="email"></div>
 <button class="bt s" id="co">Checkout</button><small>Secure checkout · discounts applied at payment</small></div>`;
 const msg=(t,c)=>{const e=$("#cmg");e.className="cm "+c;e.textContent=t};
 const draw=()=>{const ids=Object.keys(cart).filter(id=>P(id));if(!ids.length)return cartView();
  $("#ci").innerHTML=ids.map(id=>{const p=P(id),q=cart[id],o=p.price*q,l=line(p,q);return `<div class="ci"><img src="${esc(p.image)}" alt=""><div class="n">${esc(p.name)}<div><span class="q"><button data-a="-" data-i="${id}">−</button><span>${q}</span><button data-a="+" data-i="${id}">+</button></span><button class="rm" data-r="${id}">Remove</button></div></div><div class="p">${money(l)}${l<o?`<s>${money(o)}</s>`:""}</div></div>`}).join("");
  const s=sub(),d=s*cpPct()/100;
  $("#sum").innerHTML=`<div class="sr"><span>Subtotal</span><b>${money(s)}</b></div>${d?`<div class="sr d"><span>${esc(coupon)} (${cpPct()}% off)</span><span>−${money(d)}</span></div><div class="sr"><span>Total</span><b>${money(s-d)}</b></div>`:""}`;
  $$("#ci .q button").forEach(b=>b.onclick=()=>{const i=b.dataset.i;cart[i]+=b.dataset.a==="+"?1:-1;if(cart[i]<=0)delete cart[i];save();badge();draw();upd()});
  $$("#ci .rm").forEach(b=>b.onclick=()=>{delete cart[b.dataset.r];save();badge();draw()})};
 const ap=()=>{const v=$("#cc").value.trim();if(!v){coupon="";save();msg("","");draw();upd();return}
  const r=tryCode(v);if(!r.ok){coupon="";save()}else $("#cc").value=coupon;msg(r.msg,r.ok?"g":"r");draw();upd();return r.ok};
 $("#ca2").onclick=ap;$("#cc").onkeydown=e=>{if(e.key==="Enter")ap()};
 $("#ce").oninput=e=>{email=e.target.value;save()};
 $("#co").onclick=()=>{const v=$("#cc").value.trim();if(v&&v.toUpperCase()!==coupon&&!ap())return;
  if(!/^\S+@\S+\.\S+$/.test($("#ce").value.trim())){toast("Enter a valid email");$("#ce").focus();return}email=$("#ce").value.trim();save();pay()};
 if(coupon)msg(coupon+" applied: "+cpPct()+"% off","g");draw()}
let mi=1,rates={};
function pay(){if(!count())return cartView();$("#dt").textContent="Checkout";$("#db").style.cssText="";const t=total(),m=C.methods[mi];let big,body;
 if(m.coin){const r=rates[m.coin],a=r?(t/r).toFixed(m.dp):null;big=a?`${a} ${m.sym}`:"Loading rate…";
  body=`<div class="ad"><code>${esc(m.addr)}</code><button class="bt sm" id="ca">Copy</button></div><div class="nt">Only send ${esc(m.sym)} on the <b>${esc(m.net)}</b>. ${a?"Live estimate, add a little extra for fees.":"Live rate unavailable, ask for the exact amount in your ticket."}</div>`}
 else{big="R$ "+Math.ceil(t*C.robuxPerGbp).toLocaleString();body=`<div class="nt">Open a ticket and ask for a Robux gamepass. We send a link for exactly this amount.</div>`}
 const items=Object.entries(cart).filter(([id])=>P(id)).map(([id,q])=>q+"x "+P(id).name).join(", ");
 $("#db").innerHTML=`<div style="padding:4px 0"><a href="#" id="bc" style="color:var(--dim);font-size:.78rem">← Back to cart</a><div class="mt">${C.methods.map((x,i)=>`<button data-i="${i}" class="${i===mi?"on":""}">${mim(x)}${esc(x.name)}</button>`).join("")}</div>
 <div class="tt"><span>Send exactly<br><small style="color:var(--dim)">≈ ${money(t)}${coupon?" · "+esc(coupon):""}</small></span><b id="am">${esc(big)}</b></div>${body}
 <div class="nt">After paying, open a ticket on Discord with your proof (screenshot or TXID) to receive your product.</div>
 <a class="bt s" href="${esc(C.discord)}" target="_blank" rel="noopener">Open Discord ticket</a><button class="bt" id="cm" style="width:100%;margin-top:8px">Copy order message</button></div>`;
 $("#bc").onclick=e=>{e.preventDefault();cartView()};
 $$(".mt button").forEach(b=>b.onclick=()=>{mi=+b.dataset.i;pay()});
 if($("#ca"))$("#ca").onclick=()=>copy(m.addr,m.name+" address copied");
 if(m.coin&&rates[m.coin])$("#am").onclick=()=>copy((t/rates[m.coin]).toFixed(m.dp),"Amount copied");
 $("#cm").onclick=()=>copy(`Hi, I paid for ${items} (${money(t)}${coupon?", code "+coupon:""}) with ${m.name}. Email: ${email}`,"Message copied")}
const cids=C.methods.filter(m=>m.coin).map(m=>m.coin).join(",");
if(cids)fetch("https://api.coingecko.com/api/v3/simple/price?ids="+cids+"&vs_currencies=gbp").then(r=>r.json()).then(j=>{Object.keys(j).forEach(k=>rates[k]=j[k].gbp);if(dr.classList.contains("on")&&$("#am")&&$("#bc"))pay()}).catch(()=>{});

/* support chat: scripted FAQ bot (preset questions or free typing) */
const FAQ=[
 {q:"How do I get my product?",k:"get receive deliver delivery access download after bought order ticket key where",a:"After you pay, open a ticket in our Discord and send your proof (a screenshot or the TXID). Your product is delivered instantly once we confirm it.",btn:["Open Discord ticket",C.discord]},
 {q:"Which payments do you accept?",k:"pay payment payments method robux bitcoin btc litecoin ltc crypto card paypal",a:"We accept Robux, Bitcoin and Litecoin. Pick one at checkout and you'll see the exact amount and address."},
 {q:"Are there any discounts?",k:"discount coupon code promo sale cheaper percent deal",a:"Yes. Buying 2 or more gets 10% off automatically, and you can enter a coupon code in your cart. We post codes in our Discord."},
 {q:"What do I need to run it?",k:"windows system requirements pc mac linux run need compatible",a:"Cloudy supports Windows 10 and 11. There's no Mac or Linux version right now."},
 {q:"What's included?",k:"features include included config configs aim visuals movement lifetime updates",a:"Smooth aim assist, clean visuals, movement options, a config system, priority updates, a premium Discord role, a private support channel and 2 free configs. It's a lifetime edition."},
 {q:"Refund policy?",k:"refund money back return chargeback cancel",a:"All sales are final once delivered, but if the product doesn't work and we can't fix it, you can request a refund in your ticket.",act:["Read refund policy",()=>{closeDr();legal("Refund Policy")}]},
 {q:"Is it safe to use?",k:"safe ban banned detect detected undetected risk risky",a:"No script can be guaranteed 100% safe, and using third-party software in a game always carries some risk of account action. We push fast updates, so check our Discord for the current status before you play."},
 {q:"Talk to a human",k:"human staff agent person admin real owner someone",a:"Sure! Our team answers fastest in a Discord ticket.",btn:["Open Discord ticket",C.discord]}];
const NOPE={a:"I'm not sure about that one. A real person can help in a Discord ticket.",btn:["Open Discord ticket",C.discord]};
function reply(t){const w=t.toLowerCase().match(/[a-z]+/g)||[];if(!w.length)return NOPE;
 if(w.length<4&&w.some(x=>["hi","hello","hey","yo"].includes(x)))return{a:"Hey! Pick a question below or type your own."};
 let best=null,bs=0;for(const f of FAQ){const ks=f.k.split(" ");let s=0;for(const x of w)if(x.length>2&&ks.some(k=>k===x||(x.length>3&&(k.startsWith(x)||(k.length>3&&x.startsWith(k))))))s++;if(s>bs){bs=s;best=f}}
 return best||NOPE}
const cmsg=$("#cmsg");let chatInit=0;
function add(t,who,f){const d=document.createElement("div");d.className="m "+who;d.textContent=t;
 if(f&&f.btn){const a=document.createElement("a");a.className="bt";a.href=f.btn[1];a.target="_blank";a.rel="noopener";a.textContent=f.btn[0];d.append(document.createElement("br"),a)}
 if(f&&f.act){const b=document.createElement("button");b.className="bt";b.textContent=f.act[0];b.onclick=f.act[1];d.append(document.createElement("br"),b)}
 cmsg.append(d);cmsg.scrollTop=cmsg.scrollHeight;return d}
async function ask(t,f){add(t,"u");const ty=add("typing…","b ty");await wait(450+Math.random()*400);ty.remove();add(f.a,"b",f)}
function send(){const i=$("#cin"),v=i.value.trim();if(!v)return;i.value="";ask(v,reply(v))}
$("#cchips").innerHTML=FAQ.map((f,i)=>`<button data-i="${i}">${esc(f.q)}</button>`).join("");
$$("#cchips button").forEach(b=>b.onclick=()=>ask(FAQ[b.dataset.i].q,FAQ[b.dataset.i]));
$("#csn").onclick=send;$("#cin").onkeydown=e=>{if(e.key==="Enter")send()};$("#chx").onclick=closeDr;
function openCh(){dr.classList.remove("on");$("#ch").classList.add("on");sh.classList.add("on");
 if(!chatInit){chatInit=1;add("Hey! I'm the Cloudy support bot. Pick a question below or type your own. I'm automated, so for anything about your order a Discord ticket is the way to go.","b")}
 setTimeout(()=>$("#cin").focus(),350)}
$("#sup").onclick=openCh;

/* startup checks (real ones) */
(async function(){const ul=$("#ll"),bar=$("#lp");
 const row=t=>{const li=document.createElement("li");li.innerHTML=`<span class="d"></span><span>${t}</span>`;ul.append(li);requestAnimationFrame(()=>li.classList.add("s"));return li};
 const fin=(li,ok,t)=>{li.classList.add(ok?"ok":"bad");if(t)li.lastChild.textContent=t};
 let a=row("Checking connection…");bar.style.width="15%";await wait(650);
 while(!navigator.onLine){fin(a,false,"You're offline, waiting…");await new Promise(r=>addEventListener("online",r,{once:true}));a=row("Checking connection…");await wait(400)}
 fin(a,true,"Connection OK");bar.style.width="40%";
 let b=row("Checking your browser…");await wait(750);
 let good=true;try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){good=false}
 if(navigator.webdriver)good=false;
 fin(b,good,good?"Browser verified":"Browser check failed, try a normal browser window");bar.style.width="75%";
 let c=row("Loading store…");await wait(650);fin(c,true,"Ready");bar.style.width="100%";await wait(350);
 badge();route();$("#ld").classList.add("out");document.body.classList.remove("lock");setTimeout(()=>$("#ld").remove(),600)})();
</script>
