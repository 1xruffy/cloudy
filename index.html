<style>

.btn.w{background:#fff;color:#000;border-color:#fff}.btn.w:hover:not(:disabled){background:#e8e8e8}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{padding:6px 12px;font-size:.78rem}

nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 24px}

#nl{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}

.code{display:flex;align-items:center;gap:14px;margin-top:26px;padding:14px 14px 14px 22px;max-width:94vw}
.code code{font:.82rem ui-monospace,Consolas,monospace;overflow-x:auto;white-space:nowrap}
.code.lock code{color:rgba(255,255,255,.55);font-family:Spectral,serif;font-size:.9rem;user-select:none;-webkit-user-select:none}

.faq{width:min(720px,100%);margin-top:26px;text-align:left;display:grid;gap:8px}
.faq details{padding:0 18px}.faq summary{padding:15px 0;cursor:pointer;font:300 1.25rem Spectral,serif;list-style:none;display:flex;justify-content:space-between}

.wd{display:flex;gap:10px}
.dg{display:grid;grid-template-columns:210px 1fr;gap:22px;height:100%}
.dg aside{overflow:auto;display:flex;flex-direction:column;gap:2px}

.sb{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(0,0,0,.25) 75%)}

.h5{font:300 1.35rem Spectral,serif;margin:22px 0 8px}
.inc{padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.28);margin-bottom:8px;border-left:3px solid var(--c)}

.sr{padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.28);margin-bottom:8px}

.sh{display:flex;align-items:center;gap:10px;font-size:.92rem}.sh .up{color:rgba(255,255,255,.5);font-size:.76rem}.sh em{margin-left:auto;font-style:normal;color:var(--c);font-size:.8rem}
.bars{display:flex;gap:2px;margin-top:11px}.bars i{flex:1;min-width:2px;height:24px;border-radius:3px;background:var(--c)}.bars i:hover{filter:brightness(1.35)}
.ax{display:flex;justify-content:space-between;font-size:.68rem;color:rgba(255,255,255,.45);margin-top:5px}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:.76rem;color:rgba(255,255,255,.6)}.leg span{display:inline-flex;align-items:center;gap:6px}.leg .dot{width:7px;height:7px;box-shadow:none}
.cl{padding:16px 0;border-bottom:1px solid rgba(255,255,255,.1)}.cl h4{font-size:1.5rem}.cl h4 small{font:.78rem Spectral;color:rgba(255,255,255,.55);margin-left:8px}
.cl ul{margin:8px 0 0 18px;font-size:.86rem;line-height:1.7;color:rgba(255,255,255,.75)}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);z-index:99998;background:#000;border:1px solid rgba(255,255,255,.2);padding:9px 18px;border-radius:99px;font-size:.86rem;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* enter gate (only if the browser blocks sound) */
#gt{position:fixed;inset:0;z-index:9500;background:#000;display:grid;place-items:center;cursor:pointer;text-align:center}
#gt[hidden]{display:none}
#gp{font:italic 300 1.5rem Spectral,Georgia,serif;color:rgba(255,255,255,.85)}

@keyframes gl{50%{transform:scaleX(.25);opacity:.35}}
#gs{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:none;border:0;color:rgba(255,255,255,.5);font-size:.8rem;cursor:pointer;padding:8px 14px}#gs:hover{color:#fff}

/* ===== intro: particles spiral in from the dark and assemble the name, then detonate ===== */
#ld{position:fixed;inset:0;z-index:9000;cursor:pointer;overflow:hidden}
#lv{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.1),rgba(0,0,0,.7) 75%,rgba(0,0,0,.95))}
#lc{position:absolute;inset:0;width:100%;height:100%}
#lw{position:absolute;left:0;right:0;top:50%;transform:translateY(-55%);text-align:center;font:300 clamp(4.2rem,16vw,12rem)/1.12 Spectral,Georgia,serif;white-space:nowrap;pointer-events:none}
#lwi{display:inline-block;opacity:0;color:#fff;text-shadow:0 0 40px rgba(166,239,230,.35)}
#lg{position:absolute;left:0;right:0;top:calc(50% + clamp(2.6rem,9vw,7rem));text-align:center;font:italic 300 1.15rem Spectral,Georgia,serif;color:rgba(255,255,255,.72);opacity:0}
#lm{position:absolute;left:28px;right:28px;bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;font-size:.8rem;color:rgba(255,255,255,.55);opacity:0}
#lp{font:300 3.2rem Spectral,serif;color:#fff;line-height:1}
#lt{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.1)}
#lf{height:100%;background:linear-gradient(90deg,#a6efe6,#fff);transform:scaleX(0);transform-origin:left;box-shadow:0 0 16px rgba(166,239,230,.7)}
#bg{transition:filter 2.2s cubic-bezier(.2,.7,.2,1),transform 2.2s cubic-bezier(.2,.7,.2,1)}
body.bgb #bg{filter:blur(22px) saturate(1.2);transform:scale(1.14)}
nav b .nm{transition:opacity .3s}body.fly nav b .nm{opacity:0}
#snd{display:inline-flex;align-items:center}
.ln{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.ln>span{display:block;transform:translateY(108%);transition:transform 1.1s cubic-bezier(.2,.9,.2,1) calc(var(--i)*.12s)}
body.in .ln>span{transform:none}
.rv{opacity:0;transform:translateY(16px);transition:opacity 1s cubic-bezier(.2,.9,.2,1) calc(.35s + var(--i)*.1s),transform 1s cubic-bezier(.2,.9,.2,1) calc(.35s + var(--i)*.1s)}

nav,#snap,.dots{transition:opacity .8s}
body.pre nav,body.pre #snap,body.pre .dots{opacity:0}
@media(max-width:760px){nav{padding:12px}nav b span{display:none}nav a{padding:6px 8px;font-size:.78rem}nav a.hm{display:none}.dots{display:none}.fg{grid-template-columns:1fr}.s{padding-top:110px}
  .dg{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dg aside{flex-direction:row;overflow-x:auto}.dg aside button{white-space:nowrap}}
</style>
</head>

    os.type=o.type||"sine";os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.attack||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g);g.connect(mg);os.start(t);os.stop(t+d+.05)};
  const noise=(d,o={})=>{const a=run();if(!a)return;const n=Math.max(1,a.sampleRate*d|0),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+(o.delay||0),v=o.vol==null?.1:o.vol;
    s.buffer=buf;f.type=o.type||"bandpass";f.Q.value=o.q||1;f.frequency.setValueAtTime(o.from||1000,t);f.frequency.exponentialRampToValueAtTime(o.to||o.from||1000,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.attack||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);

  const S={

      g.animate([{opacity:1},{opacity:0}],{duration:400,fill:"forwards"}).finished.then(()=>g.remove(),()=>g.remove());res()};

function runLoader(){
  const L=$("#ld"),b=document.body,C=CONFIG.loader;let over=false,split=false,skip=false,ready=false,hum=null,raf=0;
  const show=()=>{b.classList.remove("pre","fly","bgb");b.classList.add("in")};
  const end=()=>{if(over)return;over=true;cancelAnimationFrame(raf);if(hum)hum.stop();show();L.animate([{opacity:1},{opacity:0}],{duration:400,fill:"forwards"}).finished.then(()=>L.remove(),()=>L.remove())};
  setTimeout(end,18000);
  if(C.enabled===false||(C.respectReducedMotion===true&&matchMedia("(prefers-reduced-motion:reduce)").matches)){over=true;L.remove();show();return}
  const inner=$("#lwi"),fill=$("#lf"),lp=$("#lp"),lm=$("#ls"),cv=$("#lc"),cx=cv.getContext("2d");
  inner.textContent=CONFIG.storeName;$("#lg").textContent=CONFIG.tagline;
  const A=(e,k,o)=>e.animate(k,Object.assign({fill:"forwards"},o)).finished.catch(()=>{});
  const img=src=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=src});
  const fontsP=Promise.race([document.fonts.load('300 100px Spectral'),wait(2500)]).catch(()=>{});
  Promise.race([Promise.all([img(CONFIG.cursor.src),img("assets/store.png")]),wait(5000)]).then(()=>ready=true);
  L.onclick=()=>{if(split)end();else skip=true};
  (async()=>{
    await fontsP;if(over)return;
    SFX.play("enter");
    const W=cv.width=innerWidth,H=cv.height=innerHeight,mx=W/2,my=H/2,R=Math.max(W,H),clamp=v=>Math.max(0,Math.min(1,v));
    /* sample the name's pixels: every lit pixel becomes a particle that spirals in to its spot */
    const rr=inner.getBoundingClientRect(),fs=parseFloat(getComputedStyle($("#lw")).fontSize);
    const oc=document.createElement("canvas");oc.width=W;oc.height=H;const o=oc.getContext("2d");
    o.font=`300 ${fs}px Spectral,Georgia,serif`;o.textAlign="center";o.textBaseline="alphabetic";o.fillStyle="#fff";
    const mt=o.measureText(CONFIG.storeName),fa=mt.fontBoundingBoxAscent||fs*.9,fd=mt.fontBoundingBoxDescent||fs*.3;
    o.fillText(CONFIG.storeName,rr.left+rr.width/2,rr.top+(rr.height-(fa+fd))/2+fa);
    const d=o.getImageData(0,0,W,H).data,step=Math.max(3,Math.round(fs/55)),P=[];
    for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>128){
      const a=Math.random()*6.283,r=R*(.55+Math.random()*.4);
      P.push({tx:x,ty:y,sx:mx+Math.cos(a)*r,sy:my+Math.sin(a)*r,a,de:Math.random(),sw:(Math.random()-.5)*7,s:1.4+Math.random()*1.8,x:0,y:0,vx:0,vy:0})}
    while(P.length>6500)P.splice(Math.random()*P.length|0,1);
    let prog=0,phase=0,bt=0,last=performance.now();
    const frame=now=>{
      const dt=Math.min(.05,(now-last)/1000);last=now;cx.globalAlpha=1;cx.globalCompositeOperation="source-over";cx.clearRect(0,0,W,H);cx.globalCompositeOperation="lighter";
      if(phase===0){
        for(const p of P){
          const u=clamp((prog-p.de*.45)/.55),e=1-Math.pow(1-u,3),k=1-e,ox=(p.sx-p.tx)*k,oy=(p.sy-p.ty)*k,c=Math.cos(p.sw*k),s=Math.sin(p.sw*k);
          cx.globalAlpha=.2+.8*e;cx.fillStyle=u<1?"#a6efe6":"#fff";
          cx.fillRect(p.tx+ox*c-oy*s+Math.sin(now/400+p.a)*.6*e,p.ty+ox*s+oy*c+Math.cos(now/430+p.a)*.6*e,p.s,p.s)}
      }else{
        bt+=dt;const dr=Math.pow(.18,dt);cx.globalAlpha=clamp(1-bt/1.5);cx.fillStyle="#cffaf4";
        for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=dr;p.vy*=dr;cx.fillRect(p.x,p.y,p.s,p.s)}
        cx.globalCompositeOperation="source-over";cx.lineWidth=2;cx.strokeStyle="#fff";
        [0,.16].forEach(dl=>{const q=bt-dl;if(q>0&&q<1.3){cx.globalAlpha=(1-q/1.3)*.7;cx.beginPath();cx.arc(mx,my,q*R*.75,0,7);cx.stroke()}});
      }
      raf=requestAnimationFrame(frame)};
    raf=requestAnimationFrame(frame);
    A($("#lg"),[{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:900,delay:900});A($("#lm"),[{opacity:0},{opacity:1}],{duration:600,delay:200});
    /* 1. particles gather, the hum rises with them */
    hum=SFX.hum();let lastT=0;const t0=performance.now(),M=C.messages;
    await new Promise(r=>{(function f(){
      const t=Math.min(1,(performance.now()-t0)/(skip?300:C.minMs));let p=1-Math.pow(1-t,2.2);if(!ready)p=Math.min(p,.93);
      prog=p;fill.style.transform=`scaleX(${p})`;lp.textContent=Math.floor(p*100);hum.set(p);
      const n=Math.floor(p*10);if(n>lastT){lastT=n;SFX.play("tick",p)}
      lm.textContent=M[p>=1?M.length-1:Math.min(M.length-2,Math.floor(p*(M.length-1)))];
      if(p>=1&&ready)r();else requestAnimationFrame(f)})()});
    if(over)return;hum.stop();SFX.play("riser");await wait(550);if(over)return;
    /* 2. detonation: particles blast outward, shockwaves ring, the name snaps in, the background focuses */
    split=true;b.classList.remove("bgb");SFX.play("boom");
    for(const p of P){p.x=p.tx;p.y=p.ty;const a=Math.atan2(p.ty-my,p.tx-mx),sp=250+Math.random()*950;p.vx=Math.cos(a)*sp+(Math.random()-.5)*220;p.vy=Math.sin(a)*sp+(Math.random()-.5)*220}
    phase=1;
    A($("#lv"),[{opacity:1},{opacity:0}],{duration:1500,easing:"ease-out"});
    A(inner,[{opacity:0,filter:"blur(12px)",transform:"scale(.96)"},{opacity:1,filter:"blur(0)",transform:"scale(1)"}],{duration:600,easing:"cubic-bezier(.2,.9,.2,1)"});
    [$("#lm"),$("#lg"),$("#lt")].forEach(e=>A(e,[{opacity:1},{opacity:0}],{duration:350}));
    await wait(1000);if(over)return;
    /* 3. the name flies up into the nav on a curve while the page rises in */
    const nm=document.querySelector("nav b .nm"),tr=nm.getBoundingClientRect();
    b.classList.add("fly");b.classList.remove("pre");setTimeout(()=>{b.classList.add("in");SFX.play("air")},700);SFX.play("whoosh");
    if(tr.width>0){const s=tr.width/rr.width,dx=tr.left+tr.width/2-(rr.left+rr.width/2),dy=tr.top+tr.height/2-(rr.top+rr.height/2);
      await A(inner,[{transform:"none"},{transform:`translate(${dx*.55}px,${dy*.55-34}px) scale(${1-(1-s)*.6})`,offset:.55},{transform:`translate(${dx}px,${dy}px) scale(${s})`}],{duration:1300,easing:"cubic-bezier(.7,0,.2,1)"})}
    else await A(inner,[{opacity:1},{opacity:0,transform:"translateY(-30px) scale(.92)"}],{duration:700,easing:"ease"});
    SFX.play("land");b.classList.remove("fly");
    await A(inner,[{opacity:1},{opacity:0}],{duration:250});
    end();
  })().catch(end);
}
gate().then(runLoader);

/* ---------- animated background (colour changes as you scroll) ---------- */
const snap=$("#snap"),secs=$$("#snap>.s");
(function(){
  const cv=$("#bg"),cx=cv.getContext("2d"),W=220,H=124;cv.width=W;cv.height=H;
  const hex=h=>{const n=parseInt(h.replace("#",""),16);return[n>>16&255,n>>8&255,n&255]};
  const P=CONFIG.palettes.map(p=>p.map(hex)),img=cx.createImageData(W,H),dots=$("#dots");
  secs.forEach((s,i)=>{const d=document.createElement("i");d.onclick=()=>snap.scrollTo({top:s.offsetTop,behavior:"smooth"});dots.append(d)});
  const D=[...dots.children];let pos=0,lastI=0;
  const target=()=>{const y=snap.scrollTop;let i=0;secs.forEach((s,k)=>{if(s.offsetTop<=y+2)i=k});
    const a=secs[i].offsetTop,n=secs[i+1];return n?i+Math.min(1,(y-a)/Math.max(1,n.offsetTop-a)):i};
  function frame(ms){
    const t=ms/1000*.35;pos+=(target()-pos)*.09;
    const i=Math.min(P.length-1,Math.floor(pos)),j=Math.min(P.length-1,i+1),f=Math.min(1,pos-i),
      d=P[i][0].map((v,k)=>v+(P[j][0][k]-v)*f),l=P[i][1].map((v,k)=>v+(P[j][1][k]-v)*f);
    const ri=Math.round(pos);D.forEach((e,k)=>e.classList.toggle("on",k===ri));if(ri!==lastI){lastI=ri;if(!document.body.classList.contains("pre"))SFX.play("section")}
    const a=img.data;let n=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const u=x/W*7,v=y/H*4.2;
      const w=Math.sin(u+t*1.3+2.2*Math.sin(v*1.4-t))+Math.sin(v*2.1+u*.6+t*.9+1.6*Math.sin(u*.8+t*.7))+.6*Math.sin((u+v)*1.7-t*1.1);
      let k=.5+.5*Math.sin(w*1.9);k=k*k*(3-2*k);
      a[n++]=d[0]+(l[0]-d[0])*k;a[n++]=d[1]+(l[1]-d[1])*k;a[n++]=d[2]+(l[2]-d[2])*k;a[n++]=255;
    }
    cx.putImageData(img,0,0);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  $$("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();snap.scrollTo({top:secs[a.dataset.go].offsetTop,behavior:"smooth"})});
})();

/* ---------- animated cursor ---------- */
(function(){
  if(!matchMedia("(pointer:fine)").matches)return;
  const c=$("#cur"),C=CONFIG.cursor;c.style.width=C.size+"px";
  c.onload=()=>{
    document.documentElement.classList.add("nc");
    addEventListener("mousemove",e=>{c.style.opacity=1;c.style.transform=`translate3d(${e.clientX-C.hotX}px,${e.clientY-C.hotY}px,0)`},{passive:true});
    document.addEventListener("mouseleave",()=>c.style.opacity=0);document.addEventListener("mouseenter",()=>c.style.opacity=1);
  };
  c.onerror=()=>console.warn("Cursor not found at "+C.src+" - using the normal cursor");
  c.src=C.src;
})();

function docs(){

    dc.querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=+b.dataset.i;$("#dq").value="";draw()});

/* status */
function status(){
  const days=Math.min(120,SP.days||60),svc=allSvc(),o=overall(),z=n=>String(n).padStart(2,"0");
  const stamp=()=>{const d=new Date();return z(d.getHours())+":"+z(d.getMinutes())+":"+z(d.getSeconds())};
  const rows=svc.map(s=>{
    let bad=0;const bars=[];
    for(let i=0;i<days;i++){const ago=days-1-i,state=ago===0?s.status:((s.incidents||{})[ago]||"operational");bad+=state==="outage"?1:state==="degraded"?.5:0;
      bars.push(`<i style="--c:${SC[state]}" title="${ago===0?"Today":ago+" day"+(ago===1?"":"s")+" ago"} · ${SL[state]}"></i>`)}
    const up=((days-bad)/days*100).toFixed(2);
    return `<div class="sr ${s.status!=="operational"?"bad":""}" style="--c:${SC[s.status]}"><div class="sh"><span class="dot"></span>${esc(s.name)}${SP.showUptime?`<span class="up">${up}% uptime</span>`:""}<em>${SL[s.status]}</em></div><div class="bars">${bars.join("")}</div><div class="ax"><span>${days} days ago</span><span>Today</span></div></div>`}).join("");
  const inc=(SP.incidents||[]).map(i=>`<div class="inc" style="--c:${SC[i.state]||SC.operational}"><small>${esc(i.date)} · ${SL[i.state]||""}</small><b>${esc(i.title)}</b><p style="margin-top:2px">${esc(i.text)}</p></div>`).join("");
  panel("System status",`<div class="sb" style="--c:${SC[o]}"><span class="dot"></span><div><b>${SP.headlines[o]}</b><small>Last checked <span id="lc">${stamp()}</span> · refreshes automatically</small></div></div>
    <div class="chips"><span class="chip"><span class="dot" style="--c:${SC[storeState]}"></span>Store: ${{working:"Working",updating:"Updating",down:"Down"}[st]}</span><span class="chip">${svc.filter(s=>s.status==="operational").length} of ${svc.length} operational</span></div>
    <div class="h5">Recent incidents</div>${inc||'<p class="mut">No incidents reported.</p>'}
    <div class="h5">Services</div>${rows}
    <div class="leg">${["operational","degraded","outage"].map(k=>`<span style="--c:${SC[k]}"><i class="dot"></i>${SL[k]}</span>`).join("")}</div>`);
  const iv=setInterval(()=>{const e=$("#lc");if(e)e.textContent=stamp()},1000);onClose=()=>clearInterval(iv);
}

/* redeem */
function redeem(){
  panel("Redeem key",`<p>Enter the key you received after payment.</p><input type="text" id="rk" placeholder="MYST-XXXX-0000" autocomplete="off" spellcheck="false"><div class="err" id="re"></div><button class="btn w" id="rg" style="width:100%">Redeem</button>`);
  const go=()=>{

    if(!v||!k){$("#re").textContent=v?"That key isn't valid. Check it and try again.":"Enter your key first.";SFX.play("error");return}
    SFX.play("success");const db=getDB(),first=!db[v];if(first){db[v]=Date.now();ls.set(DBK,JSON.stringify(db))}

    $("#pb").innerHTML=`<div class="kv"><span class="mut">Key</span><b id="a1"></b></div><div class="kv"><span class="mut">Type</span><b id="a2"></b></div><div class="kv"><span class="mut">Duration</span><b id="a3"></b></div><div class="kv"><span class="mut">Expires</span><b id="a4"></b></div>
      ${live?`<p style="margin-top:16px">${open?"Your script is unlocked. Copy it and run it in your executor:":"Your key is valid, but the script is locked right now."}</p><div class="code gl ${open?"":"lock"}" style="margin:10px 0 14px"><code id="kl"></code><button class="btn sm" id="kc"></button></div>`:'<p style="margin-top:16px">This key has expired. Get a new one from the premium section or on Discord.</p>'}
      <button class="btn" id="rm" style="width:100%">Redeem another key</button>`;
    $("#a1").textContent=k.key;$("#a2").textContent=k.type;$("#a3").textContent=k.days>=3650?"Lifetime":k.days+" day"+(k.days===1?"":"s");
    $("#a4").textContent=live?(k.days>=3650?"Never":new Date(end).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})):"Expired";
    if(live){$("#kl").textContent=open?CONFIG.free.script:lockMsg();$("#kc").textContent=open?"Copy":"Locked";$("#kc").disabled=!open;if(open)$("#kc").onclick=()=>copy(CONFIG.free.script,"Script copied");else $("#kl").oncopy=e=>e.preventDefault()}

    <p>Send the value above in your chosen coin (at the current rate) to the address below.</p>
    <div class="row" id="coins"></div>
    <div class="addr"><div class="mut" id="net"></div><code id="ad"></code><button class="btn sm" id="ca">Copy address</button></div>
    <label class="ck"><input type="checkbox" id="tc"><span>I am at least 18 and agree to the <a href="${esc(CONFIG.tosLink||"#")}" id="tl" target="_blank" rel="noopener" style="color:#fff">Terms of Service</a>.</span></label>
    ${H?`<a class="btn" href="${esc(H)}" target="_blank" rel="noopener" style="width:100%;margin-bottom:8px">Pay via checkout link</a>`:""}
    <button class="btn w" id="paid" style="width:100%" disabled>I've sent the payment</button>
    <p style="text-align:center;margin-top:10px;font-size:.8rem">Keys are delivered after your payment is confirmed</p>`);
  const showP=()=>{$("#np").textContent=money(final());const o=promo?price(p):"";$("#op").textContent=o&&o!==final()?money(o):""};
  const showC=w=>{coin=w;$("#net").textContent=w.coin+" · "+w.network;$("#ad").textContent=w.address;[...$("#coins").children].forEach(b=>b.classList.toggle("on",b.dataset.c===w.coin))};
  CONFIG.crypto.wallets.forEach(w=>{const b=document.createElement("button");b.className="btn sm";b.textContent=w.coin;b.dataset.c=w.coin;b.onclick=()=>showC(w);$("#coins").append(b)});
  showC(coin);showP();
  $("#ca").onclick=()=>copy(coin.address,"Address copied");
  if(!CONFIG.tosLink)$("#tl").onclick=e=>{e.preventDefault();toast("Terms link coming soon")};
  $("#tc").onchange=e=>$("#paid").disabled=!e.target.checked;
  const apply=()=>{const v=norm($("#pi").value),c=(CC.list||[]).find(x=>norm(x.code)===v),pm=$("#pm");let err="";
    if(!v)err="Enter a code first.";else if(!c||c.active===false)err="That code isn't valid.";
    else if(c.expiresAt&&Date.now()>new Date(c.expiresAt))err="That code has expired.";
    else if(c.plans&&!c.plans.includes(p.id))err="That code doesn't work for this product.";
    SFX.play(err?"error":"success");promo=err?null:c;pm.className=err?"err":"err ok";pm.textContent=err||c.code+" applied: "+c.percent+"% off";showP()};
  $("#pg").onclick=apply;$("#pi").onkeydown=e=>{if(e.key==="Enter")apply()};
  $("#paid").onclick=()=>{
    const ref="MYST-"+Math.random().toString(36).slice(2,8).toUpperCase(),amt=money(final()),pc=promo;
    $("#pt").textContent="Almost done";
    $("#pb").innerHTML=`<p>Open a ticket on Discord and send this reference plus your transaction hash. Your ${esc(p.name)} key is delivered once the payment confirms. Amount: ${amt}.${pc?" Discount code used: "+esc(pc.code)+".":""}</p>
      <div class="addr" style="margin-top:16px"><code id="rf" style="margin:0;cursor:pointer">${ref}</code></div><p>Save this reference. It is only shown once.</p>
      <div class="row"><a class="btn w" href="${esc(CONFIG.discordLink||"#")}" target="_blank" rel="noopener">Open Discord</a><button class="btn" id="dn">Done</button></div>`;
    $("#rf").onclick=()=>copy(ref,"Reference copied");$("#dn").onclick=closeP;
  };
}
route();
</script>
</body>
</html>
